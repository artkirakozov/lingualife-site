<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Learning — Spanish for Real Life · Airport Prototype</title>
  <style>
:root {
  --bg: radial-gradient(circle at top, #fff9ef 0%, #f5efe4 46%, #eee6da 100%);
  --ink: #161311;
  --muted: #6f675f;
  --card: rgba(255, 251, 244, 0.9);
  --card-strong: #fffdf8;
  --accent: #ff6b35;
  --accent-dark: #cb4a1f;
  --blue: #1f6feb;
  --green: #0d8d5c;
  --gold: #f6bf4f;
  --line: rgba(22, 19, 17, 0.1);
  --shadow: 0 24px 70px rgba(45, 31, 17, 0.12);
  --shadow-soft: 0 14px 32px rgba(45, 31, 17, 0.08);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--bg);
}
button, select { font: inherit; }
.app { min-height: 100vh; display: grid; grid-template-columns: 300px 1fr; }
.sidebar {
  padding: 28px 22px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,247,232,.95), rgba(255,255,255,.74));
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand-wrap { margin-bottom: 24px; }
.brand {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -.05em;
}
.subtitle { color: var(--muted); margin: 4px 0 0; line-height: 1.35; }
.progress-meta {
  margin: 16px 0 22px;
  padding: 12px 14px;
  border: 1px solid rgba(255,107,53,.18);
  border-radius: 18px;
  background: rgba(255,255,255,.72);
  color: var(--accent-dark);
  font-weight: 800;
}
.step {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 12px;
  border-radius: 16px;
  color: var(--muted);
  cursor: pointer;
  margin-bottom: 6px;
  font-weight: 700;
  transition: .18s ease;
}
.step span {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: rgba(22,19,17,.06);
  color: var(--ink);
  font-size: 13px;
  font-weight: 900;
}
.step:hover { background: rgba(255,255,255,.65); color: var(--ink); }
.step.active { background: var(--ink); color: white; box-shadow: var(--shadow-soft); }
.step.active span { background: rgba(255,255,255,.14); color: white; }
.main { padding: 38px; max-width: 1180px; width: 100%; }
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 24px;
  margin-bottom: 24px;
  align-items: stretch;
}
.hero-panel {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 22px;
}
.visual-strip {
  display:grid;
  grid-template-columns: 1.45fr .8fr .8fr;
  gap:12px;
  margin-top:20px;
}
.visual-shot {
  position:relative;
  min-height:166px;
  border-radius:24px;
  overflow:hidden;
  background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.42)), var(--photo) center/cover;
  box-shadow: var(--shadow-soft);
}
.visual-shot.large { min-height: 208px; }
.visual-shot::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.06), transparent 28%, rgba(11,14,21,.56));
}
.visual-shot span {
  position:absolute;
  left:14px;
  bottom:14px;
  z-index:1;
  color:white;
  font-weight:900;
  letter-spacing:-.02em;
}
.hero-stat, .glass-card, .summary-card, .handoff-card, .code-card, .telegram-header, .summary-grid > * {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.8);
  box-shadow: var(--shadow-soft);
}
.hero-stat {
  padding: 16px;
  border-radius: 18px;
}
.hero-stat strong { display: block; font-size: 24px; letter-spacing: -.04em; }
.hero-stat span { color: var(--muted); font-size: 14px; }
.eyebrow, .section-kicker {
  color: var(--accent-dark);
  font-weight: 900;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: .12em;
}
h1 {
  font-size: clamp(34px, 5vw, 68px);
  line-height: .95;
  letter-spacing: -.07em;
  margin: 12px 0 10px;
}
p { color: var(--muted); font-size: 18px; line-height: 1.58; }
.mode-card, .content-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 30px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
}
.mode-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.label { color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; }
.mode, .controls button, .choice, .memory-tile, .word-tile {
  border: 1px solid var(--line);
  background: white;
  border-radius: 999px;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: 850;
  transition: .18s ease;
}
.mode:hover, .controls button:hover, .choice:hover, .memory-tile:hover, .word-tile:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.mode.active { background: linear-gradient(135deg, var(--accent), #ff8a50); color: white; border-color: transparent; }
.content-card { min-height: 560px; padding: 34px; position: relative; overflow: hidden; }
.content-card.airport-start {
  background:
    linear-gradient(110deg, rgba(8,12,22,.82), rgba(8,12,22,.34)),
    radial-gradient(circle at 74% 18%, rgba(255,255,255,.28), transparent 18%),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Logan_Airport_International_Arrivals_Hall.jpg/1600px-Logan_Airport_International_Arrivals_Hall.jpg") center/cover;
  color: white;
}
.content-card.airport-start::before {
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:42%;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 26px, transparent 26px 54px), linear-gradient(0deg,rgba(0,0,0,.42),transparent);
}
.content-card.airport-start .screen-title,
.content-card.airport-start p,
.content-card.airport-start li,
.content-card.airport-start .section-kicker { color: white; position: relative; z-index: 1; }
.badge {
  display: inline-block;
  padding: 8px 11px;
  background: #ffe4d8;
  color: var(--accent-dark);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 16px;
}
.screen-title { font-size: 36px; letter-spacing: -.05em; margin: 0 0 12px; }
.grid, .home-grid, .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 22px; }
.compact-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.three-col { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; margin-top: 18px; }
.word, .phrase, .message, .info-box, .exercise, .pattern-box, .drill-card, .word-panel, .branch-card, .summary-card {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card-strong);
  box-shadow: var(--shadow-soft);
}
.word strong, .phrase strong { font-size: 22px; display: block; margin-bottom: 4px; }
.word-panel { display: grid; gap: 10px; align-content: start; }
.branch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 22px; }
.branch-card { text-align: left; cursor: pointer; transition: .18s ease; }
.branch-card strong { display: block; font-size: 22px; letter-spacing: -.03em; margin: 8px 0 6px; }
.branch-card p { font-size: 15px; margin: 0; }
.branch-card.active { border-color: rgba(31,111,235,.35); box-shadow: 0 0 0 3px rgba(31,111,235,.12), var(--shadow-soft); }
.branch-meta, .state-pill-row, .cta-row, .exercise-topline, .mission-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.branch-meta span, .mini-tag, .state-pill, .mini-score {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 7px 10px;
  background: rgba(22,19,17,.05);
  color: var(--ink);
  font-size: 12px;
  font-weight: 900;
}
.mini-tag { background: #fff0df; color: var(--accent-dark); }
.phrase small, .photo-caption p { display: block; margin-top: 10px; color: var(--muted); line-height: 1.48; }
.info-box b, .exercise h3, .pattern-box b, .drill-card h3, .summary-card b, .telegram-header h3 { font-size: 18px; }
.info-box p, .exercise p, .drill-card p { margin: 8px 0 0; font-size: 15px; }
.info-box.dark { background: #171614; color: white; }
.info-box.dark p, .info-box.dark b { color: white; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 22px; }
.photo-card { background: #fff; border: 1px solid rgba(23,22,20,.12); border-radius: 24px; padding: 10px; box-shadow: 0 14px 28px rgba(35,24,13,.11); }
.photo-placeholder, .memory-photo {
  background: var(--photo);
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.photo-placeholder {
  min-height: 145px;
  border-radius: 18px;
  border: 8px solid #fff7e8;
  background-size: cover;
  background-position: center;
}
.photo-placeholder::before, .memory-photo::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 25% 20%, rgba(255,255,255,.76), transparent 22%), linear-gradient(0deg, rgba(0,0,0,.24), transparent 55%);
}
.photo-placeholder span {
  position: absolute;
  left: 12px;
  bottom: 10px;
  background: rgba(255,255,255,.9);
  padding: 6px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
}
.photo-caption { padding: 12px 4px 3px; }
.photo-caption strong { display: block; font-size: 20px; letter-spacing: -.02em; }
.photo-caption em { color: var(--accent-dark); font-style: normal; font-weight: 850; }
.exercise, .pattern-box, .word-panel, .handoff-card { margin-top: 18px; }
.memory-stage { display:grid; grid-template-columns: minmax(220px, .9fr) 1.1fr; gap:16px; align-items:stretch; margin-top:14px; }
.memory-photo {
  min-height: 220px;
  border-radius: 24px;
  border: 10px solid #fff7e8;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 14px 28px rgba(35,24,13,.12);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:16px;
}
.memory-photo .ru-label, .memory-photo small { position:relative; z-index:1; }
.memory-photo .ru-label {
  align-self:flex-start;
  background:rgba(255,255,255,.92);
  color:#171614;
  border-radius:999px;
  padding:8px 12px;
  font-size:22px;
  font-weight:950;
}
.memory-photo small { margin-top:10px; color:white; font-weight:750; text-shadow:0 1px 8px rgba(0,0,0,.35); }
.memory-options { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.memory-tile, .word-tile {
  min-width: 112px;
  border-radius: 16px;
  border-style: dashed;
  background: #fff7e8;
}
.word-tile.with-hint { text-align:left; display:flex; flex-direction:column; gap:4px; min-width:150px; }
.word-tile.no-hint { min-width: 150px; background: #fffdf8; }
.word-tile.with-hint strong { font-size:16px; }
.word-tile.with-hint small { color:var(--muted); font-weight:700; line-height:1.3; }
.recall-mode { color: var(--accent-dark) !important; font-weight: 800; }
.selected { outline: 3px solid rgba(31,111,235,.26); }
.correct, .good { background: #dcfce7 !important; border-color: #22c55e !important; color: #14532d; }
.wrong, .bad { background: #fee2e2 !important; border-color: #ef4444 !important; color: #7f1d1d; }
.feedback { margin-top: 12px; padding: 12px 14px; border-radius: 14px; font-weight: 800; }
.drill-stack { display:grid; gap:14px; margin-top:20px; }
.voice-button {
  margin-top:12px;
  border:0;
  border-radius:999px;
  padding:14px 18px;
  background:var(--ink);
  color:white;
  font-weight:900;
  cursor:pointer;
}
.voice-button.recording { background:#dc2626; animation:pulse 1s infinite; }
.voice-button.done { background:#16a34a; }
@keyframes pulse { 50% { opacity: .4; } }
.ai-feedback {
  margin-top:14px;
  padding:16px;
  border-radius:18px;
  background:#eef6ff;
  border:1px solid rgba(31,111,235,.22);
}
.ai-feedback ul, .pattern-box ul, .summary-card ul, .glass-card ul { margin:8px 0 0; padding-left:20px; color:var(--muted); line-height:1.55; }
.ai-feedback code, .code-card code {
  background:white;
  padding:3px 6px;
  border-radius:8px;
  color:var(--blue);
  font-weight:850;
}
.microcopy { font-size:14px; margin-top:10px; }
.target-line {
  margin-top:10px;
  padding:12px;
  border-radius:14px;
  background:#171614;
  color:#fff7e8;
  font-weight:850;
}
.telegram-wrap { margin-top: 14px; }
.telegram-header { padding: 16px; border-radius: 22px; margin-bottom: 14px; }
.telegram {
  background: linear-gradient(180deg, #edf6ff, #e2f0ff);
  border: 1px solid rgba(31,111,235,.12);
  border-radius: 26px;
  padding: 18px;
}
.message { max-width: 82%; margin: 10px 0; }
.bot { background: white; }
.user { background: #dff7df; margin-left: auto; }
.voice { display: inline-flex; align-items: center; gap: 8px; color: var(--green); font-weight: 850; }
.voice::before { content: "●"; animation: pulse 1.2s infinite; }
.handoff-card, .summary-card, .glass-card, .code-card { border-radius: 24px; padding: 18px; }
.code-card { margin-top: 14px; }
.state-pill { background: #fff0df; color: var(--accent-dark); }
.state-pill-readiness { background: rgba(13,141,92,.12); color: var(--green); }
.primary-dark, .controls .primary { background: var(--ink); color: white; border-color: transparent; }
.ghost { background: rgba(255,255,255,.7); }
.top-gap { margin-top: 20px; }
.hint-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px; }
.controls { margin-top: 18px; display: flex; justify-content: space-between; gap: 12px; }
.controls button { font-size: 16px; }
.summary-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.readiness-card { display:grid; align-content:start; gap:10px; }
.readiness-number { font-size: 52px; line-height: 1; letter-spacing: -.06em; font-weight: 900; }
.glass-card {
  flex: 1 1 280px;
  min-width: 260px;
  background: rgba(255,255,255,.14);
  border-color: rgba(255,255,255,.18);
  backdrop-filter: blur(10px);
}
.glass-card p, .glass-card li { color: rgba(255,255,255,.92); }
.mission-grid { margin-top: 22px; }
.selectors { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.selectors label { display: grid; gap: 7px; color: var(--muted); font-weight: 800; }
.selectors select {
  min-width: 190px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  background: white;
  font-weight: 750;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events:none;
  background:#171614;
  color:white;
  padding:13px 18px;
  border-radius:999px;
  box-shadow:var(--shadow);
  font-weight:850;
  z-index:20;
  transition:.22s ease;
  max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
  .hero, .three-col { grid-template-columns: 1fr; }
  .visual-strip { grid-template-columns: 1fr; }
  .main { padding: 18px; }
}
@media (max-width: 720px) {
  .memory-stage, .hero-panel { grid-template-columns: 1fr; display:grid; }
  .content-card { padding: 22px; }
  h1 { font-size: 42px; }
}

</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-wrap">
        <div class="brand">Life Learning</div>
        <div class="subtitle">Spanish for Real Life · Airport prototype</div>
      </div>
      <div class="progress-meta" id="progressMeta">Quick Pass · Step 1/7</div>
      <nav id="steps"></nav>
    </aside>

    <main class="main">
      <section class="hero">
        <div>
          <div class="eyebrow" id="eyebrow">Course entry · choose your path</div>
          <h1 id="heroTitle">Life Learning</h1>
          <p id="heroCopy">Spanish for Real Life · Airport prototype.</p>
        </div>
        <div class="mode-card">
          <div class="label">Layer</div>
          <button id="quickMode" class="mode active">Quick pass</button>
          <button id="deepMode" class="mode">Deep dive</button>
        </div>
      </section>

      <section class="content-card" id="screen"></section>

      <section class="controls">
        <button id="prev">← Назад</button>
        <button id="next" class="primary">Дальше →</button>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script>
const photoLibrary = {

const vocabItems = [
  ['entrada', 'вход', 'Точка входа в терминал или нужную зону.', photoLibrary.signs],

const phraseItems = [
  ['¿Me puede ayudar?', 'Можете мне помочь?', 'Главная стартовая просьба: коротко, вежливо, без лишней грамматики.'],

  ['Entonces, ¿tengo que ir allí?', 'То есть мне нужно идти туда?', 'Проверка понимания перед действием.']

const branchData = {
  transfer: {

    badge: 'Deep dive · branch 1',
    title: 'Из аэропорта в город без хаоса',

    tip: 'В реальной жизни ученик чаще сравнивает скорость, цену и точку остановки — не “учит транспорт вообще”.',
    words: [
      ['tren', 'поезд'], ['autobús exprés', 'экспресс-автобус'], ['metro', 'метро'], ['billete', 'билет'], ['parada', 'остановка'], ['cuánto cuesta', 'сколько стоит']

  index: 0,
  branch: 'transfer',
  showHints: true,
  memoryRound: 0,
  memoryScore: 0,

  selectedRescue: null,

  voiceDone: false,
  voiceChecked: false
};

const memoryDeck = vocabItems.map((w, i) => ({ es: w[0], ru: w[1], hint: w[2], photo: w[3], id: i }));

const screen = document.getElementById('screen');
const steps = document.getElementById('steps');
const quickBtn = document.getElementById('quickMode');
const deepBtn = document.getElementById('deepMode');
const eyebrow = document.getElementById('eyebrow');
const heroTitle = document.getElementById('heroTitle');
const heroCopy = document.getElementById('heroCopy');
const progressMeta = document.getElementById('progressMeta');

function vocabCards() {
  return vocabItems.map((w) => `<article class="photo-card" style="--photo:${w[3]}"><div class="photo-placeholder" role="img" aria-label="Реальное фото аэропортной среды: ${w[1]}"><span>${w[0]}</span></div><div class="photo-caption"><strong>${w[0]}</strong><em>${w[1]}</em><p>${w[2]}</p></div></article>`).join('');
}

function visualStrip() {
  return `<div class="visual-strip"><div class="visual-shot large" style="--photo:${photoLibrary.arrivals}"><span>Airport arrival</span></div><div class="visual-shot" style="--photo:${photoLibrary.signs}"><span>Signs & navigation</span></div><div class="visual-shot" style="--photo:${photoLibrary.security}"><span>Passport control</span></div></div>`;
}

function memoryOptions(round) {
  const target = memoryDeck[round % memoryDeck.length];
  const pool = memoryDeck.filter(x => x.es !== target.es);
  const distractors = [pool[(round + 2) % pool.length], pool[(round + 5) % pool.length], pool[(round + 8) % pool.length], pool[(round + 10) % pool.length]];
  return [target, ...distractors].sort((a, b) => ((a.es.length + round) % 5) - ((b.es.length + round) % 5));
}

function chooseMemory(value) {
  if (state.memoryAnswered) return;
  const target = memoryDeck[state.memoryRound % memoryDeck.length];
  state.memoryChoice = value;
  state.memoryAnswered = true;
  if (value === target.es) state.memoryScore += 1;
  render();
}

function nextMemory() {
  state.memoryRound = (state.memoryRound + 1) % memoryDeck.length;
  state.memoryChoice = null;
  state.memoryAnswered = false;
  render();
}

function resetMemory() {
  state.memoryRound = 0;
  state.memoryScore = 0;
  state.memoryChoice = null;
  state.memoryAnswered = false;
  render();
}

function chooseQuiz(value) { state.selectedQuiz = value; render(); }
function addWord(w) { state.phraseBuild.push(w); render(); }
function clearPhrase() { state.phraseBuild = []; render(); }
function chooseRescue(x) { state.selectedRescue = x; render(); }
function toggleHints() { state.showHints = !state.showHints; render(); }
function setBranch(branch) { state.branch = branch; state.index = 1; render(); }
function setDeep() { state.mode = 'deep'; state.index = 0; render(); }
function setQuick() { state.mode = 'quick'; state.index = 0; render(); }
function go(i) { state.index = i; render(); }

function readinessScore() {
  let score = 0;
  if (state.memoryScore >= 3) score += 1;
  if (state.selectedQuiz === 'aseos / baño') score += 1;
  if (state.phraseBuild.join(' ') === state.phraseTarget.join(' ')) score += 1;
  if (state.selectedRescue) score += 1;
  if (state.voiceChecked) score += 1;
  return score;
}

function readinessLabel() {
  const score = readinessScore();
  if (score >= 5) return 'Ready for Telegram';
  if (score >= 3) return 'Almost ready';
  return 'Prep in progress';
}

function checkPhrase() {
  const built = state.phraseBuild.join(' ');
  const target = state.phraseTarget.join(' ');
  flash(built === target ? 'Отлично: фраза собрана правильно.' : `Пока не так. Цель: ${target}`);
}

function toggleVoice() {
  if (!state.voiceRecording && !state.voiceDone) {
    state.voiceRecording = true;
    render();
    return;
  }
  if (state.voiceRecording) {
    state.voiceRecording = false;
    state.voiceDone = true;
    state.voiceChecked = false;
    render();
  }
}

function checkVoice() {
  if (!state.voiceDone) return flash('Сначала запиши короткий ответ.');
  state.voiceChecked = true;
  render();
}

function resetVoice() {
  state.voiceRecording = false;
  state.voiceDone = false;
  state.voiceChecked = false;
  render();
}

function flash(text) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function tile(label, hint, action) {
  return `<button class="word-tile ${state.showHints ? 'with-hint' : 'no-hint'}" onclick="${action}"><strong>${label}</strong>${state.showHints ? `<small>${hint}</small>` : ''}</button>`;
}

}

function memoryGame() {
  const target = memoryDeck[state.memoryRound % memoryDeck.length];

  return `<div class="exercise memory-challenge"><div class="exercise-topline"><span class="section-kicker">Retrieval drill</span><span class="mini-score">Раунд ${state.memoryRound + 1}/${memoryDeck.length} · счёт ${state.memoryScore}</span></div><h3>Фото → испанское слово</h3><p>Ученик видит среду, а не словарь. Поэтому тест идёт от картинки и смысла к нужному слову.</p><div class="memory-stage"><div class="memory-photo" style="--photo:${target.photo}"><span class="ru-label">${target.ru}</span><small>${target.hint}</small></div><div class="memory-options">${options.map(o => `<button type="button" class="memory-tile ${answered && o.es === target.es ? 'correct' : ''} ${answered && state.memoryChoice === o.es && o.es !== target.es ? 'wrong' : ''}" data-memory="${o.es}">${o.es}</button>`).join('')}</div></div>${answered ? `<div class="feedback ${correct ? 'good' : 'bad'}">${correct ? 'Да — это именно тот знак, который нужно быстро узнать в аэропорту.' : `Пока нет. Верный ответ: ${target.es}.`}</div><button type="button" class="choice" data-memory-next="1">Следующий раунд →</button>` : ''}<button type="button" class="choice ghost" data-memory-reset="1">Сбросить игру</button></div>`;
}

  {

    html: () => `<span class="badge">Web prep · environment vocabulary</span><h2 class="screen-title">Сначала учим глазами ориентироваться в аэропорту</h2><p>Ученик должен узнавать среду быстрее, чем вспоминать перевод. Поэтому словарь здесь оформлен как sign recognition и короткие retrieval drills.</p><div class="photo-grid">${vocabCards()}</div>${memoryGame()}${vocabQuiz()}${vocabRecall()}`
  },
  {
    nav: 'Phrase drills',
    html: () => `<span class="badge">Web prep · phrase patterns</span><h2 class="screen-title">Не зубрёжка, а готовые speaking chunks</h2><p>Мы явно показываем логику: Web подготавливает controlled speech, Telegram потом проверяет performance в разговоре.</p><div class="grid compact-grid"><div class="info-box dark"><b>Remember these 3 first</b><p>¿Me puede ayudar? · No sé adónde tengo que ir. · ¿Puede repetir, por favor?</p></div><div class="info-box dark"><b>Pattern logic</b><p>Короткая просьба → проблема → recovery phrase → confirmation.</p></div></div><div class="hint-bar"><button class="choice ${state.showHints ? 'primary-dark' : 'ghost'}" onclick="toggleHints()">${state.showHints ? 'Hide hints' : 'Show hints'}</button><span class="mini-score">${state.showHints ? 'First pass with support' : 'Recall mode'}</span></div><div class="grid">${phraseCards()}</div>${phraseDrills()}${handoffCard({ mode: 'quick_pass', branch: 'border_then_main', pending: 'border_control', phrases: ['¿Me puede ayudar?', 'No sé adónde tengo que ir.', '¿Puede repetir, por favor?'] })}`
  },
  {
    nav: 'Border control',
    html: () => `<span class="badge">Telegram quick pass · warm-up</span><h2 class="screen-title">Мини-сцена: пограничник</h2><p>Это короткий напряжённый warm-up. Без длинной грамматики: только 3 обязательных ответа, чтобы ученик почувствовал mild pressure сразу после прилёта.</p>${telegramThread('Optional micro-scene before main airport help flow', 'Telegram получает state, что border task ещё pending. После выполнения бот мягко кидает learner в основную сцену помощи.', ['scene_id: airport_01', 'mode: quick_pass', 'branch: border_control', 'pending: mandatory_3_turns'], [['bot', 'Mini-scene: Border control. ¿Turismo o trabajo?'], ['user', 'Vengo por turismo.'], ['bot', '¿Cuántos días se queda?'], ['user', 'Me quedo tres días.'], ['bot', '¿Dónde se aloja?'], ['user', 'Me alojo en un hotel.']], '<b>Good enough outcome:</b> learner ответил коротко, спокойно и без залипания.')}<div class="pattern-box"><b>Optional extension turns</b><ul><li>¿Tiene reserva? → Sí, tengo reserva.</li><li>¿Cuándo vuelve? → Vuelvo el lunes.</li></ul></div>`
  },
  {
    nav: 'Airport help',
    html: () => `<span class="badge">Telegram quick pass · main scene</span><h2 class="screen-title">Главная airport help сцена</h2><p>Теперь learner должен попросить помощь, восстановиться после быстрой реплики и подтвердить следующий шаг. Здесь Telegram = performance layer урока.</p>${telegramThread('Scene 1: Airport help', 'Бот не объясняет долго. Он даёт живую реплику, короткий feedback и двигает сцену дальше.', ['scene_id: airport_01', 'mode: quick_pass', 'branch: main_help', 'border: completed'], [['bot', 'Hola, dígame, ¿en qué le puedo ayudar?'], ['user', '¿Me puede ayudar? No sé adónde tengo que ir.'], ['bot', 'Good — you asked for help clearly. Tiene que ir al final del pasillo y girar a la derecha.'], ['user', '¿Puede repetir, por favor?'], ['bot', 'Sí, a la derecha. Después sigue recto.'], ['user', 'Vale, primero a la derecha y después sigo recto, ¿no?'], ['bot', 'Exacto. ¿Necesita algo más?'], ['user', 'No, gracias.']], '<b>What is being trained:</b> clear request → recovery move → paraphrase → polite close.')} `
  },
  {
    nav: 'Completion',
    html: () => `<span class="badge">Scene complete</span><h2 class="screen-title">Airport complete: первый реальный win</h2><p>Ученик прошёл end-to-end цепочку: вошёл в сцену, собрал среду, прогнал speaking chunks, ответил в border warm-up и справился с основным help flow.</p><div class="summary-grid"><div class="summary-card"><b>Что получилось</b><ul><li>попросил помощь</li><li>обозначил проблему</li><li>использовал recovery phrase</li><li>подтвердил маршрут и закрыл диалог</li></ul></div><div class="summary-card"><b>Что улучшать дальше</b><ul><li>говорить No sé adónde tengo que ir более гладко</li><li>быстрее доставать Más despacio, por favor</li><li>добавить одну branch-specific фразу</li></ul></div><div class="summary-card readiness-card"><b>Readiness score</b><div class="readiness-number">${readinessScore()}/5</div><p>${readinessLabel()} — Web уже показывает, насколько ученик готов к живой сцене.</p></div></div><div class="cta-row top-gap"><button class="choice primary-dark" onclick="setDeep()">Open Deep Dive hub</button><button class="choice ghost" onclick="flash('Next life scene could be city transfer / taxi.')">Continue to next life scene</button></div>`
  }
];

const deepScreens = [
  { nav: 'Deep Dive hub', html: () => deepHub() },
  { nav: 'Branch prep', html: () => deepBranch() },
  { nav: 'Telegram branch', html: () => deepTelegram() }
];

function screens() {
  return state.mode === 'quick' ? quickScreens : deepScreens;
}

function bindInteractive() {
  screen.querySelectorAll('[data-memory]').forEach(btn => btn.addEventListener('click', () => chooseMemory(btn.dataset.memory)));
  screen.querySelectorAll('[data-memory-next]').forEach(btn => btn.addEventListener('click', nextMemory));
  screen.querySelectorAll('[data-memory-reset]').forEach(btn => btn.addEventListener('click', resetMemory));
}

function render() {
  const data = screens();
  state.index = Math.max(0, Math.min(state.index, data.length - 1));
  const current = data[state.index];
  screen.className = `content-card ${current.heroClass || ''}`.trim();
  screen.innerHTML = typeof current.html === 'function' ? current.html() : current.html;
  bindInteractive();
  steps.innerHTML = data.map((s, i) => `<button class="step ${i === state.index ? 'active' : ''}" onclick="go(${i})"><span>${String(i + 1).padStart(2, '0')}</span>${s.nav}</button>`).join('');
  quickBtn.classList.toggle('active', state.mode === 'quick');
  deepBtn.classList.toggle('active', state.mode === 'deep');
  eyebrow.textContent = current.home ? 'Course entry · choose your path' : (state.mode === 'quick' ? 'Scene 1 · Airport arrival' : 'Deep Dive · Airport branches');
  heroTitle.textContent = current.home ? 'Life Learning' : (state.mode === 'quick' ? 'Подготовься на Web. Справься в Telegram.' : 'Освой аэропорт глубже, по реальным веткам.');
  heroCopy.textContent = current.home ? 'Spanish for Real Life · Airport prototype.' : (state.mode === 'quick' ? 'Web explicitly handles prep and confidence; Telegram handles live speaking performance.' : 'Choose a stronger branch and pass the exact scene state into Telegram.');
  progressMeta.textContent = `${state.mode === 'quick' ? 'Quick Pass' : 'Deep Dive'} · Step ${state.index + 1}/${data.length}`;
}

document.getElementById('next').onclick = () => { state.index = Math.min(state.index + 1, screens().length - 1); render(); };
document.getElementById('prev').onclick = () => { state.index = Math.max(state.index - 1, 0); render(); };
quickBtn.onclick = setQuick;
deepBtn.onclick = setDeep;

Object.assign(window, { go, setDeep, setQuick, setBranch, chooseMemory, nextMemory, resetMemory, chooseQuiz, addWord, clearPhrase, checkPhrase, chooseRescue, toggleVoice, checkVoice, resetVoice, flash, toggleHints });

render();

</script>
</body>
</html>
