<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Learning — Испанский для реальной жизни</title>
  <style>
:root {
  --bg: radial-gradient(circle at top, #fff9ef 0%, #f5efe4 46%, #eee6da 100%);
  --ink: #161311;
  --muted: #6f675f;
  --card: rgba(255, 251, 244, 0.9);
  --card-strong: #fffdf8;
  --accent: #ff6b35;
  --accent-dark: #cb4a1f;
  --blue: #1f6feb;
  --green: #0d8d5c;
  --gold: #f6bf4f;
  --line: rgba(22, 19, 17, 0.1);
  --shadow: 0 24px 70px rgba(45, 31, 17, 0.12);
  --shadow-soft: 0 14px 32px rgba(45, 31, 17, 0.08);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--bg);
}
button, select { font: inherit; }
.app { min-height: 100vh; display: grid; grid-template-columns: 300px 1fr; }
.sidebar {
  padding: 28px 22px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,247,232,.95), rgba(255,255,255,.74));
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand-wrap { margin-bottom: 24px; }
.brand {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -.05em;
}
.subtitle { color: var(--muted); margin: 4px 0 0; line-height: 1.35; }
.progress-meta {
  margin: 16px 0 22px;
  padding: 12px 14px;
  border: 1px solid rgba(255,107,53,.18);
  border-radius: 18px;
  background: rgba(255,255,255,.72);
  color: var(--accent-dark);
  font-weight: 800;
}
.step {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 12px;
  border-radius: 16px;
  color: var(--muted);
  cursor: pointer;
  margin-bottom: 6px;
  font-weight: 700;
  transition: .18s ease;
}
.step span {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: rgba(22,19,17,.06);
  color: var(--ink);
  font-size: 13px;
  font-weight: 900;
}
.step b, .step small { display:block; }
.step b { font-size: 14px; }
.step small { margin-top: 3px; font-size: 11px; color: inherit; opacity: .78; font-weight: 800; }
.step:hover { background: rgba(255,255,255,.65); color: var(--ink); }
.step.active { background: var(--ink); color: white; box-shadow: var(--shadow-soft); }
.step.active span { background: rgba(255,255,255,.14); color: white; }
.main { padding: 38px; max-width: 1180px; width: 100%; }
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 24px;
  margin-bottom: 24px;
  align-items: stretch;
}
.hero-panel {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 22px;
}
.visual-strip {
  display:grid;
  grid-template-columns: 1.45fr .8fr .8fr;
  gap:12px;
  margin-top:20px;
}
.route-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.route-card {
  min-height: 166px;
  border-radius: 24px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,244,231,.88));
  box-shadow: var(--shadow-soft);
  padding: 18px;
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
}
.route-card strong { font-size: 24px; letter-spacing: -.03em; }
.route-card em { color: var(--muted); font-style: normal; font-weight: 700; }
.route-step {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255,107,53,.11);
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .08em;
}
.route-active {
  background: linear-gradient(180deg, #fff2e8, #fffdf8);
  border-color: rgba(255,107,53,.24);
}
.visual-shot {
  position:relative;
  min-height:166px;
  border-radius:24px;
  overflow:hidden;
  background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.42)), var(--photo) center / cover;
  box-shadow: var(--shadow-soft);
}
.visual-shot.large { min-height: 208px; }
.visual-shot::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.06), transparent 28%, rgba(11,14,21,.56));
}
.visual-shot span {
  position:absolute;
  left:14px;
  bottom:14px;
  z-index:1;
  color:white;
  font-weight:900;
  letter-spacing:-.02em;
}
.hero-stat, .glass-card, .summary-card, .handoff-card, .code-card, .telegram-header, .summary-grid > * {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.8);
  box-shadow: var(--shadow-soft);
}
.hero-stat {
  padding: 16px;
  border-radius: 18px;
}
.hero-stat strong { display: block; font-size: 24px; letter-spacing: -.04em; }
.hero-stat span { color: var(--muted); font-size: 14px; }
.hero-promise {
  display: grid;
  gap: 14px;
  margin-top: 18px;
}
.promise-line {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255,107,53,.12);
  color: var(--accent-dark);
  font-weight: 900;
}
.hero-outcomes {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.hero-outcome {
  padding: 14px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.78);
  box-shadow: var(--shadow-soft);
}
.hero-outcome b { display:block; margin-bottom: 4px; }
.hero-outcome span { color: var(--muted); font-size: 14px; line-height: 1.35; }
.eyebrow, .section-kicker {
  color: var(--accent-dark);
  font-weight: 900;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: .12em;
}
h1 {
  font-size: clamp(34px, 5vw, 68px);
  line-height: .95;
  letter-spacing: -.07em;
  margin: 12px 0 10px;
}
p { color: var(--muted); font-size: 18px; line-height: 1.58; }
.hero-progress { margin-top: 18px; }
.progress-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.progress-pill {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.8);
  color: var(--muted);
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.progress-pill.done {
  background: rgba(13,141,92,.08);
  color: var(--green);
  border-color: rgba(13,141,92,.18);
}
.progress-pill.active {
  background: var(--ink);
  color: white;
  border-color: transparent;
}
.mode-card, .content-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 30px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
}
.mode-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.label { color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; }
.mode, .controls button, .choice, .memory-tile, .word-tile {
  border: 1px solid var(--line);
  background: white;
  border-radius: 999px;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: 850;
  transition: .18s ease;
}
.mode:hover, .controls button:hover, .choice:hover, .memory-tile:hover, .word-tile:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.mode.active { background: linear-gradient(135deg, var(--accent), #ff8a50); color: white; border-color: transparent; }
.content-card { min-height: 560px; padding: 34px; position: relative; overflow: hidden; }
.content-card.airport-start {
  background:
    linear-gradient(110deg, rgba(8,12,22,.82), rgba(8,12,22,.34)),
    radial-gradient(circle at 74% 18%, rgba(255,255,255,.28), transparent 18%),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Logan_Airport_International_Arrivals_Hall.jpg/1600px-Logan_Airport_International_Arrivals_Hall.jpg") center / cover;
  color: white;
}
.content-card.airport-start::before {
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:42%;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 26px, transparent 26px 54px), linear-gradient(0deg,rgba(0,0,0,.42),transparent);
}
.content-card.airport-start .screen-title,
.content-card.airport-start p,
.content-card.airport-start li,
.content-card.airport-start .section-kicker { color: white; position: relative; z-index: 1; }
.badge {
  display: inline-block;
  padding: 8px 11px;
  background: #ffe4d8;
  color: var(--accent-dark);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 16px;
}
.screen-title { font-size: 36px; letter-spacing: -.05em; margin: 0 0 12px; }
.grid, .home-grid, .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 22px; }
.compact-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.three-col { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; margin-top: 18px; }
.landing-utility { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.selectors-secondary { margin-top: 0; }
.selectors-secondary label { font-size: 13px; color: var(--muted); }
.selectors-secondary select {
  min-width: 148px;
  padding: 10px 12px;
  background: rgba(255,255,255,.84);
}
.low-emphasis { opacity: .84; }
.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}
.meta-chip {
  display: inline-flex;
  align-items: center;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(22,19,17,.06);
  color: var(--ink);
  font-size: 13px;
  font-weight: 900;
}
.cta-stack { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); }
.below-fold-stack {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid rgba(22,19,17,.08);
}
.how-it-works ol {
  margin: 16px 0 0;
  padding-left: 20px;
  display: grid;
  gap: 12px;
}
.how-it-works li { color: var(--ink); }
.how-it-works li span { display: block; color: var(--muted); margin-top: 4px; font-size: 15px; }
.below-grid { margin-top: 16px; }
.settings-box {
  margin-top: 18px;
  padding: 16px;
  border: 1px dashed var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.56);
}
.settings-box p { font-size: 15px; margin: 8px 0 0; }
.promise-card, .pressure-card, .scenario-coach, .recall-gate {
  margin-top: 18px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.82);
  box-shadow: var(--shadow-soft);
}
.promise-list {
  margin: 12px 0 0;
  padding-left: 20px;
  display: grid;
  gap: 8px;
}
.promise-list li, .pressure-card li, .scenario-coach li { color: var(--ink); }
.pressure-card ul, .scenario-coach ul {
  margin: 10px 0 0;
  padding-left: 20px;
  display: grid;
  gap: 8px;
}
.pressure-inline {
  margin: 12px 0 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(255,107,53,.1);
  color: var(--accent-dark);
  font-size: 13px;
  font-weight: 800;
}
.word, .phrase, .message, .info-box, .exercise, .pattern-box, .drill-card, .word-panel, .branch-card, .summary-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card-strong);
  box-shadow: var(--shadow-soft);
}
.word strong, .phrase strong { font-size: 22px; display: block; margin-bottom: 4px; }
.word-panel { display: grid; gap: 10px; align-content: start; }
.branch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 22px; }
.branch-card { text-align: left; cursor: pointer; transition: .18s ease; }
.branch-card strong { display: block; font-size: 22px; letter-spacing: -.03em; margin: 8px 0 6px; }
.branch-card p { font-size: 15px; margin: 0; }
.branch-card.active { border-color: rgba(31,111,235,.35); box-shadow: 0 0 0 3px rgba(31,111,235,.12), var(--shadow-soft); }
.branch-meta, .state-pill-row, .cta-row, .exercise-topline, .mission-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.branch-meta span, .mini-tag, .state-pill, .mini-score {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 7px 10px;
  background: rgba(22,19,17,.05);
  color: var(--ink);
  font-size: 12px;
  font-weight: 900;
}
.mini-tag { background: #fff0df; color: var(--accent-dark); }
.phrase small, .photo-caption p { display: block; margin-top: 10px; color: var(--muted); line-height: 1.48; }
.info-box b, .exercise h3, .pattern-box b, .drill-card h3, .summary-card b, .telegram-header h3 { font-size: 18px; }
.info-box p, .exercise p, .drill-card p { margin: 8px 0 0; font-size: 15px; }
.info-box.dark { background: #171614; color: white; }
.info-box.dark p, .info-box.dark b { color: white; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 22px; }
.photo-card { background: #fff; border: 1px solid rgba(23,22,20,.12); border-radius: 24px; padding: 10px; box-shadow: 0 14px 28px rgba(35,24,13,.11); }
.photo-placeholder, .memory-photo {
  background: var(--photo);
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.photo-placeholder {
  min-height: 145px;
  border-radius: 18px;
  border: 8px solid #fff7e8;
  background-size: cover;
  background-position: center;
}
.photo-placeholder::before, .memory-photo::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 25% 20%, rgba(255,255,255,.76), transparent 22%), linear-gradient(0deg, rgba(0,0,0,.24), transparent 55%);
}
.photo-placeholder span {
  position: absolute;
  left: 12px;
  bottom: 10px;
  background: rgba(255,255,255,.9);
  padding: 6px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
}
.photo-caption { padding: 12px 4px 3px; }
.photo-caption strong { display: block; font-size: 20px; letter-spacing: -.02em; }
.photo-caption em { color: var(--accent-dark); font-style: normal; font-weight: 850; }
.exercise, .pattern-box, .word-panel, .handoff-card { margin-top: 18px; }
.memory-stage { display:grid; grid-template-columns: minmax(220px, .9fr) 1.1fr; gap:16px; align-items:stretch; margin-top:14px; }
.word-flow-shell { padding: 20px; }
.word-flow-intro { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; }
.single-word-card {
  margin-top: 14px;
  display: grid;
  grid-template-columns: minmax(260px, .95fr) 1fr;
  gap: 18px;
  align-items: stretch;
}
.single-word-photo {
  min-height: 320px;
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.28)), var(--photo) center / cover;
  box-shadow: var(--shadow-soft);
}
.single-word-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: 14px;
  padding: 12px 0;
}
.single-word-copy strong {
  font-size: clamp(34px, 5vw, 52px);
  letter-spacing: -.05em;
  line-height: .95;
}
.word-translation {
  padding: 14px 16px;
  border-radius: 18px;
  background: rgba(22,19,17,.04);
}
.word-translation em {
  display: block;
  color: var(--accent-dark);
  font-style: normal;
  font-weight: 900;
}
.word-translation p { margin: 8px 0 0; font-size: 15px; }
.single-word-actions {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.small-choice { padding: 10px 12px; }
.quiz-card .single-word-copy strong { font-size: 28px; }
.quiz-stack {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  width: min(360px, 100%);
}
.quiz-choice {
  justify-content: flex-start;
  border-radius: 16px;
  width: 100%;
}
.memory-photo {
  min-height: 220px;
  border-radius: 24px;
  border: 10px solid #fff7e8;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 14px 28px rgba(35,24,13,.12);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:16px;
}
.memory-photo .ru-label, .memory-photo small { position:relative; z-index:1; }
.memory-photo .ru-label {
  align-self:flex-start;
  background:rgba(255,255,255,.92);
  color:#171614;
  border-radius:999px;
  padding:8px 12px;
  font-size:22px;
  font-weight:950;
}
.memory-photo small { margin-top:10px; color:white; font-weight:750; text-shadow:0 1px 8px rgba(0,0,0,.35); }
.memory-options { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.memory-tile, .word-tile {
  min-width: 112px;
  border-radius: 16px;
  border-style: dashed;
  background: #fff7e8;
}
.word-tile.with-hint { text-align:left; display:flex; flex-direction:column; gap:4px; min-width:150px; }
.word-tile.no-hint { min-width: 150px; background: #fffdf8; }
.word-tile.with-hint strong { font-size:16px; }
.word-tile.with-hint small { color:var(--muted); font-weight:700; line-height:1.3; }
.recall-mode { color: var(--accent-dark) !important; font-weight: 800; }
.selected { outline: 3px solid rgba(31,111,235,.26); }
.correct, .good {
  background: linear-gradient(180deg, #ecfdf3, #dcfce7) !important;
  border-color: #22c55e !important;
  color: #14532d;
  box-shadow: inset 0 0 0 1px rgba(34,197,94,.15);
}
.wrong, .bad {
  background: linear-gradient(180deg, #fff3f3, #fee2e2) !important;
  border-color: #ef4444 !important;
  color: #7f1d1d;
  box-shadow: inset 0 0 0 1px rgba(239,68,68,.12);
}
.feedback { margin-top: 12px; padding: 12px 14px; border-radius: 14px; font-weight: 800; line-height: 1.45; }
.drill-stack { display:grid; gap:14px; margin-top:20px; }
.tile-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}
.phrase-hero-stack {
  display: grid;
  gap: 14px;
  margin-top: 18px;
}
.phrase-chip-row {
  margin-top: 0;
}
.screen-title-tight {
  max-width: 14ch;
}
.intro-copy-tight {
  max-width: 58ch;
  font-size: 16px;
}
.pattern-family {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}
.pattern-row {
  display: grid;
  grid-template-columns: 72px minmax(70px, auto) 1fr;
  gap: 10px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255,255,255,.76);
}
.pattern-row span,
.pattern-row em {
  color: var(--muted);
  font-style: normal;
  font-weight: 700;
}
.pattern-row strong {
  font-size: 20px;
  letter-spacing: -.03em;
}
.turn-card {
  margin-top: 16px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--card-strong);
  box-shadow: var(--shadow-soft);
}
.bot-line {
  display: grid;
  gap: 6px;
  margin-bottom: 10px;
}
.bot-line strong {
  font-size: 26px;
  letter-spacing: -.04em;
}
.checklist {
  margin: 10px 0 0;
  padding-left: 20px;
  display: grid;
  gap: 8px;
}
.checklist li { color: rgba(255,255,255,.92); }
.micro-summary { margin-top: 18px; }
.success-card {
  background: linear-gradient(180deg, rgba(13,141,92,.08), rgba(255,255,255,.92));
}
.completion-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
  gap: 16px;
  margin-top: 22px;
  align-items: start;
}
.completion-summary {
  display: grid;
  gap: 14px;
}
.completion-sections {
  display: grid;
  gap: 14px;
}
.completion-sections ul {
  margin: 10px 0 0;
  padding-left: 20px;
}
.completion-cta-row {
  margin-top: 24px;
}
.quiet-link {
  background: transparent;
  border-style: dashed;
}
.panic-kit {
  margin-top: 18px;

function weakestStep() {
  const areas = [
    { index: 2, score: state.vocabQuizScore / vocabFlowItems.length },
    { index: 3, score: phraseFlowDone() ? 1 : phraseStageProgress() / 7 },
    { index: 4, score: state.borderScore / borderTurns.length },
    { index: 5, score: state.helpScore / helpTurns.length }
  ];
  return areas.sort((a, b) => a.score - b.score)[0];
}

function repeatWeakest() {
  const target = weakestStep();
  state.mode = 'quick';
  state.index = target.index;

function quickStepReady(index) {
  if (index <= 1) return true;
  if (index === 2) return state.vocabStage === 'result';
  if (index === 3) return phraseFlowDone();
  if (index === 4) return state.borderStage === 'result';
  if (index === 5) return state.helpStage === 'result';
  return true;
}

function vocabQuizOptions(index) {
  const target = vocabFlowItems[index];
  const others = vocabFlowItems.filter((item) => item[0] !== target[0]).map((item) => item[0]);
  return [target[0], ...others.slice(0, 2)].sort((a, b) => a.localeCompare(b));
}

function vocabNativeOptions(index) {
  const target = vocabFlowItems[index];
  const others = vocabFlowItems.filter((item) => item[0] !== target[0]).map((item) => item[0]);
  return [target[0], ...others.slice(0, 2)].sort((a, b) => a.localeCompare(b));
}

function resetVoice() {
  state.voiceRecording = false;
  state.voiceDone = false;
  state.voiceChecked = false;
  render();
}

function startBorderFlow() {
  state.borderStage = 'turn';
  state.borderTurn = 0;
  state.borderChoice = null;
  state.borderAnswered = false;
  state.borderScore = 0;
  render();
}

function chooseBorderOption(value) {
  if (state.borderStage !== 'turn' || state.borderAnswered) return;
  const turn = borderTurns[state.borderTurn];
  state.borderChoice = value;
  state.borderAnswered = true;
  if (value === turn.correct) state.borderScore += 1;
  render();
}

function nextBorderTurn() {
  if (state.borderTurn < borderTurns.length - 1) {
    state.borderTurn += 1;
    state.borderChoice = null;
    state.borderAnswered = false;
  } else {
    state.borderStage = 'result';
  }
  render();
}

function resetBorderFlow() {
  state.borderStage = 'intro';
  state.borderTurn = 0;
  state.borderChoice = null;
  state.borderAnswered = false;
  state.borderScore = 0;
  render();
}

function startHelpFlow() {
  state.helpStage = 'turn';
  state.helpTurn = 0;
  state.helpChoice = null;
  state.helpAnswered = false;
  state.helpScore = 0;
  render();
}

function chooseHelpOption(value) {
  if (state.helpStage !== 'turn' || state.helpAnswered) return;
  const turn = helpTurns[state.helpTurn];
  state.helpChoice = value;
  state.helpAnswered = true;
  if (value === turn.correct) state.helpScore += 1;
  render();
}

function nextHelpTurn() {
  if (state.helpTurn < helpTurns.length - 1) {
    state.helpTurn += 1;
    state.helpChoice = null;
    state.helpAnswered = false;
  } else {
    state.helpStage = 'result';
  }
  render();
}

function resetHelpFlow() {
  state.helpStage = 'intro';
  state.helpTurn = 0;
  state.helpChoice = null;
  state.helpAnswered = false;
  state.helpScore = 0;
  render();
}

function phraseFlowDone() {
  return state.phraseStage === 'ready';
}

function readinessScore() {
  let score = 0;
  if (state.vocabQuizScore >= 2) score += 1;
  if (phraseFlowDone()) score += 1;
  if (state.phraseBasicsScore >= 2) score += 1;
  if (state.borderScore >= 2) score += 1;
  if (state.helpScore >= 4) score += 1;
  return score;
}

function readinessLabel() {
  const score = readinessScore();
  if (score >= 5) return 'Готов к разговору';
  if (score >= 3) return 'Можно идти дальше';
  return 'Идём по шагам';
}

function flash(text) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function tile(label, hint, action) {
  return `<button class="word-tile ${state.showHints ? 'with-hint' : 'no-hint'}" onclick="${action}"><strong>${label}</strong>${state.showHints ? `<small>${hint}</small>` : ''}</button>`;
}

function handoffCard({ mode, branch, pending, phrases }) {
  return `<div class="handoff-card"><div><span class="section-kicker">Telegram handoff</span><h3>Продолжить сцену голосом</h3><p>Web подготовил фразы и структуру. Следующий слой — короткие голосовые ответы в Telegram с тем же контекстом сцены.</p></div><div class="telegram-state"><span>scene: airport_01</span><span>mode: ${mode}</span><span>branch: ${branch}</span><span>next: ${pending}</span></div><div class="code-card"><b>Фразы для повтора</b><code>${phrases.join(' · ')}</code></div><div class="cta-row"><button class="choice primary-dark" onclick="flash('Telegram-переход будет подключён в следующем слое MVP.')">Открыть Telegram-тренировку</button><button class="choice ghost" onclick="flash('Фразы останутся в контексте этой сцены.')">Повторить фразы</button></div></div>`;
}

function newWordsFlow() {
  const totalVocabScore = state.vocabQuizScore + state.vocabNativeScore + state.vocabSentenceScore;

  if (state.vocabStage === 'intro') {

  }

  if (state.vocabStage === 'ready') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Упражнение 1</span><span class="mini-score">Картинка → слово</span></div><h3>Теперь подбор по картинке</h3><p>Смотри на изображение, сначала сам вспоминай слово, потом выбирай вариант.</p><div class="word-flow-intro"><button class="choice primary-dark" onclick="startVocabQuiz()">Начать</button><button class="choice ghost" onclick="resetVocabFlow()">Посмотреть карточки ещё раз</button></div></div>`;
  }

  if (state.vocabStage === 'quiz') {
    const item = vocabFlowItems[state.vocabQuizIndex];

  }

  if (state.vocabStage === 'readyNative') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Упражнение 2</span><span class="mini-score">Русский → слово</span></div><h3>Теперь отталкиваемся от родного языка</h3><p>Видишь русское слово или задачу — быстро достаёшь испанский вариант.</p><div class="word-flow-intro"><button class="choice primary-dark" onclick="startVocabNativeQuiz()">Начать</button><button class="choice ghost" onclick="go(2)">Назад к началу слов</button></div></div>`;
  }

  if (state.vocabStage === 'quizNative') {
    const item = vocabFlowItems[state.vocabNativeIndex];

  return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Слова закреплены</span><span class="mini-score">${totalVocabScore}/${totalVocabTasks}</span></div><h3>Готово — слова уже не висят в воздухе.</h3><p>Ты прошёл визуальное знакомство, подбор по картинке, выбор по-русски и вставку в короткие фразы.</p><div class="summary-grid micro-summary"><div class="summary-card"><b>Что уже закрепилось</b><ul><li>картинка → слово: ${state.vocabQuizScore}/${vocabFlowItems.length}</li><li>русский → испанский: ${state.vocabNativeScore}/${vocabFlowItems.length}</li><li>слово в фразе: ${state.vocabSentenceScore}/${vocabSentenceItems.length}</li></ul></div><div class="summary-card"><b>Что это даёт</b><ul><li>слово узнаётся визуально</li><li>быстрее достаётся из русской задачи</li><li>легче встраивается в живую речь</li></ul></div></div><div class="word-flow-intro"><button class="choice primary-dark" onclick="go(3)">К фразам</button><button class="choice ghost" onclick="resetVocabFlow()">Повторить слова</button></div></div>`;

function phraseStageProgress() {
  const map = { intro: 0, build: 1, substitute: 2, problem: 3, recovery: 4, basics: 5, voice: 6, ready: 7 };
  return map[state.phraseStage] || 0;
}

function phraseFlow() {
  if (state.phraseStage === 'intro') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Фразы</span><span class="mini-score">7 шагов</span></div><h3>Соберём полезные фразы для аэропорта</h3><p>Без теории ради теории: сначала рабочие куски речи, потом короткие вариации и только затем голос внутри сцены.</p><div class="word-flow-intro"><button class="choice primary-dark" onclick="startPhraseFlow()">Начать</button></div></div>`;
  }

  if (state.phraseStage === 'build') {
    const built = state.phraseBuild.join(' ');
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Фразы</span><span class="mini-score">1/7</span></div><h3>Собери главную просьбу</h3><p>Задача на русском: <b>«Можете мне помочь?»</b> Логика такая: открываем вопрос, называем адресата <b>me</b>, ставим вежливое <b>puede</b>, потом действие <b>ayudar</b>.</p><div class="tile-row">${[['¿', 'начало вопроса'], ['Me', 'мне'], ['puede', 'можете'], ['ayudar', 'помочь'], ['?', 'конец вопроса']].map(([x, h]) => tile(x, h, `addWord('${x}')`)).join('')}</div><div class="target-line">${built || 'Собери по-испански: “Можете мне помочь?”'}</div><div class="microcopy">Смысл не в том, чтобы выучить одну реплику, а в том, чтобы понять порядок: <b>кому</b> помогают и <b>какое действие</b> нужно.</div><div class="word-flow-intro"><button class="choice primary-dark" onclick="checkPhrase()">Проверить</button><button class="choice ghost" onclick="clearPhrase()">Сбросить</button></div></div>`;
  }

  if (state.phraseStage === 'substitute') {
    const ok = state.phraseSubChoice === 'explicar';
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Фразы</span><span class="mini-score">2/7</span></div><h3>Меняем только действие</h3><p>Задача на русском: <b>«Можете мне объяснить?»</b> Каркас уже готов: <b>¿Me puede ... ?</b> Тебе нужно понять, что меняется только последнее действие.</p><div class="target-line">Выбери глагол, который превратит каркас в фразу «Можете мне объяснить?»</div><div class="quiz-stack">${[['repetir','повторить'],['explicar','объяснить'],['indicar','подсказать / указать направление']].map(([option,hint]) => `<button class="choice quiz-choice ${state.phraseSubChoice === option ? (ok && option === 'explicar' ? 'correct' : option === 'explicar' ? '' : 'wrong') : ''}" onclick="choosePhraseSub('${option}')"><strong>${option}</strong><span>${hint}</span></button>`).join('')}</div>${state.phraseSubChoice ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? 'Верно: “¿Me puede explicar?” Тут не строится новая грамматика — ты просто сохраняешь каркас и меняешь смысловой глагол.' : 'Здесь нужен вариант explicar → “¿Me puede explicar?”'}</div><div class="microcopy">Логика конструкции: <b>¿Me puede + действие?</b> Поэтому из одного каркаса рождаются и <b>¿Me puede repetir?</b>, и <b>¿Me puede indicar?</b></div>${ok ? `<div class="word-flow-intro"><button class="choice primary-dark" onclick="nextPhraseSub()">Дальше</button></div>` : ''}` : ''}</div>`;
  }

  if (state.phraseStage === 'problem') {
    const ok = state.phraseProblemChoice === 'No sé adónde tengo que ir.';
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Фразы</span><span class="mini-score">3/7</span></div><h3>Одна проблема — одна точная фраза</h3><p><b>Ситуация:</b> ты вышел после прилёта и не понимаешь, куда идти дальше. Задача на русском: <b>«Я не знаю, куда мне идти.»</b></p>${state.phraseProblemReveal ? `<div class="quiz-stack">${['No sé adónde tengo que ir.','Tengo un problema con mi equipaje.','Me alojo en un hotel.'].map((option) => `<button class="choice quiz-choice ${state.phraseProblemChoice === option ? (ok && option === 'No sé adónde tengo que ir.' ? 'correct' : option === 'No sé adónde tengo que ir.' ? '' : 'wrong') : ''}" onclick="choosePhraseProblem('${option.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>` : `<div class="recall-gate"><div class="target-line">Скажи по-испански: «Я не знаю, куда мне идти». Сначала попробуй сам, потом открой варианты.</div><button class="choice ghost" onclick="revealPhraseProblem()">Показать варианты</button></div>`}${state.phraseProblemChoice ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? 'Да: <b>No sé</b> = «я не знаю», <b>adónde</b> = «куда», <b>tengo que ir</b> = «мне нужно идти». Так фраза собирается по смысловым кускам, а не целиком наугад.' : 'Здесь нужна фраза про маршрут: “No sé adónde tengo que ir.”'}</div>${ok ? `<div class="word-flow-intro"><button class="choice primary-dark" onclick="nextPhraseProblem()">Дальше</button></div>` : ''}` : ''}</div>`;
  }

  if (state.phraseStage === 'recovery') {
    const ok = state.phraseRecoveryChoice === '¿Puede repetir, por favor?';
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Фразы</span><span class="mini-score">4/7</span></div><h3>Фраза, которая помогает не потеряться в разговоре</h3><p><b>Ситуация:</b> сотрудник ответил слишком быстро. Задача на русском: <b>«Повторите, пожалуйста.»</b> Это не ответ по сути, а фраза управления разговором.</p>${state.phraseRecoveryReveal ? `<div class="quiz-stack">${['¿Puede repetir, por favor?','No, gracias.','Tengo tres días.'].map((option) => `<button class="choice quiz-choice ${state.phraseRecoveryChoice === option ? (ok && option === '¿Puede repetir, por favor?' ? 'correct' : option === '¿Puede repetir, por favor?' ? '' : 'wrong') : ''}" onclick="choosePhraseRecovery('${option.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>` : `<div class="recall-gate"><div class="target-line">Сначала сам собери фразу «Повторите, пожалуйста», а потом открывай варианты.</div><button class="choice ghost" onclick="revealPhraseRecovery()">Показать варианты</button></div>`}${state.phraseRecoveryChoice ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? 'Именно так: <b>puede repetir</b> = «можете повторить», <b>por favor</b> смягчает просьбу. Логика тут не в переводе слово в слово, а в вежливом действии, которое возвращает тебе контроль.' : 'Здесь нужна фраза: “¿Puede repetir, por favor?”'}</div>${ok ? `<div class="word-flow-intro"><button class="choice primary-dark" onclick="nextPhraseRecovery()">Дальше</button></div>` : ''}` : ''}</div>`;
  }

  if (state.phraseStage === 'basics') {
    const item = basePatternItems[state.phraseBasicsIndex];
    const ok = state.phraseBasicsChoice === item.answer;
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">${item.kicker}</span><span class="mini-score">${5 + state.phraseBasicsIndex}/7</span></div><h3>${item.title}</h3><p>${item.note}</p><div class="pattern-family">${item.forms.map(([subject, verb, tail]) => `<div class="pattern-row"><span>${subject}</span><strong>${verb}</strong><em>${tail}</em></div>`).join('')}</div><div class="target-line">${item.prompt}</div><div class="microcopy">Смотри на три строки выше как на один шаблон: меняется <b>кто говорит</b> → меняется форма глагола → хвост фразы остаётся тем же.</div><div class="quiz-stack">${item.options.map((option) => `<button class="choice quiz-choice ${state.phraseBasicsAnswered && option === item.answer ? 'correct' : ''} ${state.phraseBasicsAnswered && state.phraseBasicsChoice === option && option !== item.answer ? 'wrong' : ''}" onclick="chooseBasePattern('${option}')">${option}</button>`).join('')}</div>${state.phraseBasicsAnswered ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? `Да — ${item.sample}` : `Не совсем. Правильно: ${item.sample}`}</div><div class="microcopy"><b>Почему так:</b> ${item.logic}</div><div class="word-flow-intro"><button class="choice primary-dark" onclick="nextBasePattern()">${state.phraseBasicsIndex === basePatternItems.length - 1 ? 'К проверке вслух' : 'Следующая конструкция'}</button><button class="choice ghost" onclick="skipToPhraseVoice()">Пропустить</button></div>` : ''}</div>`;
  }

  if (state.phraseStage === 'voice') {
    const scenario = voiceScenarios[state.voiceScenarioIndex];
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Диалог · голосовая симуляция</span><span class="mini-score">7/7</span></div><h3>Вот ситуация — ответь по-испански</h3><p>Представь короткую голосовуху в Telegram: без чтения с экрана, без идеальных формулировок, по делу.</p><div class="scenario-grid">${voiceScenarios.map((item, index) => `<button class="scenario-card ${state.voiceScenarioIndex === index ? 'active' : ''}" onclick="setVoiceScenario(${index})"><strong>${item.title}</strong><span>${item.prompt}</span></button>`).join('')}</div><div class="scenario-coach"><b>Что нужно сделать</b><p>${scenario.prompt}</p><ul>${scenario.coaching.map((tip) => `<li>${tip}</li>`).join('')}</ul><div class="pressure-inline">MVP note: сейчас это симуляция записи. Реальный микрофон и Telegram voice-note будут подключены следующим техническим слоем.</div></div><button class="voice-button ${state.voiceRecording ? 'recording' : ''} ${state.voiceDone ? 'done' : ''}" onclick="toggleVoice()">${state.voiceRecording ? 'Остановить симуляцию' : state.voiceDone ? 'Ответ отмечен' : 'Сымитировать голосовой ответ'}</button><button class="choice" onclick="checkVoice()">Проверить</button><button class="choice ghost" onclick="resetVoice()">Повторить</button><div class="voice-note">Сейчас кнопка фиксирует готовность ответа, запись с микрофона появится в MVP-слое.</div><div class="target-line">Эталон: ${scenario.target}</div>${state.voiceDone && !state.voiceChecked ? `<p class="microcopy">Ответ готов. Теперь проверь: понял бы тебя живой собеседник?</p>` : ''}${state.voiceChecked ? `<div class="ai-feedback"><b>Что получилось</b><ul><li>Ответ привязан к конкретной ситуации.</li><li>Ты просишь помощь, восстанавливаешь контроль или называешь проблему.</li><li>Этого достаточно, чтобы сцена двигалась дальше.</li></ul></div>` : ''}</div>`;
  }

  return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Фразы собраны</span><span class="mini-score">Готово</span></div><h3>Фразы готовы</h3><p>Ты собрал главные фразы и можешь переходить дальше.</p>${handoffCard({ mode: 'quick_pass', branch: 'border_then_main', pending: 'border_control', phrases: ['¿Me puede ayudar?', 'No sé adónde tengo que ir.', 'Yo quiero ayuda.', 'Yo tengo un problema.'] })}</div>`;
}

function turnByTurnFlow({ stage, introTitle, introText, startAction, resetAction, turns, currentTurn, choice, answered, resultTitle, resultText, score, nextAction, chooseAction, ctaLabel, resultCta, secondaryCta }) {
  if (stage === 'intro') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Диалог</span><span class="mini-score">${turns.length} хода</span></div><h3>${introTitle}</h3><p>${introText}</p><div class="word-flow-intro"><button class="choice primary-dark" onclick="${startAction}()">Начать</button></div></div>`;
  }

  if (stage === 'turn') {
    const turn = turns[currentTurn];
    const ok = choice === turn.correct;
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Диалог</span><span class="mini-score">${currentTurn + 1}/${turns.length}</span></div><div class="turn-card"><div class="bot-line"><span class="section-kicker">Собеседник</span><strong>${turn.bot}</strong></div>${turn.pressure ? `<div class="pressure-inline">${turn.pressure}</div>` : ''}<p>${turn.prompt}</p><div class="quiz-stack">${turn.options.map((option) => `<button class="choice quiz-choice ${answered && option === turn.correct ? 'correct' : ''} ${answered && choice === option && option !== turn.correct ? 'wrong' : ''}" onclick="${chooseAction}('${option.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>${answered ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? turn.feedback : `Лучше так: ${turn.correct}`}</div><button class="choice primary-dark" onclick="${nextAction}()">${currentTurn === turns.length - 1 ? resultCta : ctaLabel}</button>` : ''}</div></div>`;
  }

  return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Готово</span><span class="mini-score">${score}/${turns.length} правильных ответа</span></div><h3>${resultTitle}</h3><p>${resultText}</p><div class="summary-grid micro-summary"><div class="summary-card"><b>Что уже получилось</b><ul><li>реагировать по шагам</li><li>выбирать короткий рабочий ответ</li><li>не теряться в простом диалоге</li></ul></div><div class="summary-card"><b>Что закрепить ещё</b><ul><li>доставать ответ быстрее</li><li>не теряться при быстрой реплике</li><li>подтверждать следующий шаг своими словами</li></ul></div></div><div class="word-flow-intro"><button class="choice primary-dark" onclick="${secondaryCta}">Дальше</button><button class="choice ghost" onclick="${resetAction}()">Повторить</button></div></div>`;
}

function borderFlow() {
  return turnByTurnFlow({
    stage: state.borderStage,
    introTitle: 'Паспортный контроль',
    introText: 'Ответь на три коротких вопроса по очереди.',
    startAction: 'startBorderFlow',
    resetAction: 'resetBorderFlow',
    turns: borderTurns,
    currentTurn: state.borderTurn,
    choice: state.borderChoice,
    answered: state.borderAnswered,
    resultTitle: 'Паспортный контроль пройден',
    resultText: 'Ты уже ответил на базовые вопросы и можешь идти дальше.',
    score: state.borderScore,
    nextAction: 'nextBorderTurn',
    chooseAction: 'chooseBorderOption',
    ctaLabel: 'Дальше',
    resultCta: 'Закончить',
    secondaryCta: 'go(5)'
  });
}

function helpFlow() {
  return turnByTurnFlow({
    stage: state.helpStage,
    introTitle: 'Мини-сцена: попросить помощь и не развалить разговор',
    introText: 'Здесь уже не один правильный ответ, а связная сцена: открыть разговор, пережить быстрый ответ, остановиться на незнакомом слове, подтвердить маршрут и закрыть неожиданный follow-up.',
    startAction: 'startHelpFlow',
    resetAction: 'resetHelpFlow',
    turns: helpTurns,
    currentTurn: state.helpTurn,
    choice: state.helpChoice,
    answered: state.helpAnswered,
    resultTitle: 'Мини-сцена собрана',
    resultText: 'Теперь это уже не набор фраз, а короткая живая ситуация с тремя точками давления.',
    score: state.helpScore,
    nextAction: 'nextHelpTurn',
    chooseAction: 'chooseHelpOption',
    ctaLabel: 'Дальше',
    resultCta: 'Закончить',
    secondaryCta: 'go(6)'
  });
}

function telegramThread(title, intro, chips, dialogue, summary) {
  return `<div class="telegram-wrap"><div class="telegram-header"><div><span class="section-kicker">Диалог</span><h3>${title}</h3><p>${intro}</p></div></div><div class="telegram">${dialogue.map(([role, text]) => `<div class="message ${role}">${role === 'bot' ? '<b>Собеседник:</b> ' : '<span class="voice">'}${text}${role === 'bot' ? '' : '</span>'}</div>`).join('')}</div><div class="summary-card">${summary}</div></div>`;
}

function deepHub() {
  return `<span class="badge">Практика</span><h2 class="screen-title">Выбери следующую ситуацию</h2><p>После основного маршрута не нужно повторять всё подряд: выбираешь только ту сцену, которая реально нужна.</p><div class="branch-grid">${Object.entries(branchData).map(([key, branch]) => `<button class="branch-card ${state.branch === key ? 'active' : ''}" onclick="setBranch('${key}')"><span class="mini-tag">${branch.badge}</span><strong>${branch.label}</strong><p>${branch.goal}</p></button>`).join('')}</div>`;
}

function deepBranch() {
  const branch = branchData[state.branch];
  return `<span class="badge">Практика</span><h2 class="screen-title">${branch.title}</h2><p>${branch.intro}</p><div class="grid compact-grid"><div class="info-box"><b>Что сделать</b><p>${branch.goal}</p></div><div class="info-box"><b>Фокус</b><p>${branch.tip}</p></div></div><div class="three-col"><div class="word-panel"><span class="section-kicker">Слова</span>${branch.words.map(([es, ru]) => `<div class="word"><strong>${es}</strong>${ru}</div>`).join('')}</div><div class="pattern-box"><span class="section-kicker">Куски речи</span><ul>${branch.patterns.map(x => `<li>${x}</li>`).join('')}</ul></div><div class="pattern-box"><span class="section-kicker">Что сделать в сцене</span><ul>${branch.tasks.map(x => `<li>${x}</li>`).join('')}</ul></div></div>${handoffCard({ mode: 'deep_dive', branch: branch.telegram[2].split('=')[1], pending: branch.telegram[3].split('=')[1], phrases: branch.patterns.slice(0, 3) })}`;
}

function deepTelegram() {
  const branch = branchData[state.branch];
  return `<span class="badge">Диалог</span><h2 class="screen-title">${branch.label}</h2><p>Такой разговор уже можно разыгрывать голосом: короткими ходами, без длинных монологов.</p>${telegramThread('Пример диалога', 'Сначала смотришь структуру, потом отвечаешь своими словами, как будто это Telegram voice.', branch.telegram, branch.dialogue, '<b>Цель:</b> назвать проблему, задать полезный вопрос и понять следующий шаг.')}`;
}

const quickScreens = [
  {
    nav: 'Старт',
    home: true,
    html: () => `<span class="badge">Scene 1 · Airport</span><h2 class="screen-title">Аэропорт без паники</h2><p>Короткая репетиция реального прилёта: ты просишь помощь, переспросишь быстрый ответ и подтвердить маршрут своими словами.</p><div class="hero-promise"><div class="promise-line">Web готовит. Telegram активирует голосом.</div><div class="hero-outcomes"><div class="hero-outcome"><b>5 минут</b><span>быстрый проход по аэропорту</span></div><div class="hero-outcome"><b>7 фраз</b><span>для просьбы, маршрута и recovery</span></div><div class="hero-outcome"><b>2 диалога</b><span>паспортный контроль и стойка информации</span></div></div></div>${visualStrip()}${panicKit()}${telegramValueCard()}<div class="grid compact-grid start-grid top-gap"><div class="info-box"><b>Основной маршрут</b><p>Сильный быстрый прогон: слова, фразы, голосовая симуляция и два коротких диалога.</p></div><div class="info-box"><b>Отдельные ситуации</b><p>После quick pass открываются ветки: город, багаж, паспортный контроль, документы и пересадка.</p></div></div><div class="meta-row"><span class="meta-chip">8 слов</span><span class="meta-chip">7 фраз</span><span class="meta-chip">2 диалога</span><span class="meta-chip">5 deep dives</span></div><div class="cta-stack top-gap"><button class="choice primary-dark" onclick="go(1)">Начать основной маршрут</button></div><div class="settings-box top-gap"><span class="section-kicker">Языки</span>${languageSettingsMarkup()}</div>`
  },
  {
    nav: 'Ситуация',
    heroClass: 'airport-start',
    html: () => `<span class="badge">Шаг 1 · Ситуация</span><h2 class="screen-title">Ты прилетел. Нужно быстро сориентироваться.</h2><p>Сейчас держим в голове 4 действия, которые реально спасают сцену.</p><div class="glass-card"><ul class="checklist"><li>пройти паспортный контроль</li><li>понять указатели</li><li>попросить помощь</li><li>уточнить следующий шаг</li></ul></div><div class="pressure-card top-gap"><b>Где будет давление</b><ul><li>тебе ответят слишком быстро</li><li>ты услышишь незнакомое слово</li><li>тебе зададут короткий follow-up</li></ul></div>${panicKit()}`
  },
  {
    nav: 'Слова',
    html: () => `<span class="badge">Шаг 2 · Слова</span><h2 class="screen-title">Слова, которые нужны в аэропорту</h2><p>Сначала визуально знакомимся со словами, потом гоняем их через несколько типов упражнений.</p>${newWordsFlow()}`
  },
  {
    nav: 'Фразы',
    html: () => `<span class="badge">Шаг 3 · Фразы</span><h2 class="screen-title screen-title-tight">Короткие фразы для живой ситуации</h2><p class="intro-copy-tight">Соберём не «идеальные предложения», а короткие опоры, из которых потом собирается живая речь.</p><div class="phrase-hero-stack"><div class="info-box dark"><b>Главные фразы</b><p>¿Me puede ayudar?<br>No sé adónde tengo que ir.<br>¿Puede repetir, por favor?</p></div><div class="tile-row phrase-chip-row"><span class="state-pill">quiero / quiere / quieren</span><span class="state-pill">voy / va / van</span><span class="state-pill">tengo / tiene / tienen</span></div></div>${phraseFlow()}`
  },
  {
    nav: 'Паспортный контроль',
    html: () => `<span class="badge">Шаг 4 · Диалог</span><h2 class="screen-title">Паспортный контроль</h2><p>Пройдём короткие ответы по шагам.</p>${borderFlow()}`
  },
  {
    nav: 'Попросить помощь',
    html: () => `<span class="badge">Шаг 5 · Диалог</span><h2 class="screen-title">Как попросить помощь</h2><p>Теперь это уже связная мини-сцена с давлением, а не просто ещё один quiz.</p>${helpFlow()}`
  },
  {
    nav: 'Итог',
    html: () => `<span class="badge">Шаг 6 · Итог</span><h2 class="screen-title screen-title-tight">Миссия пройдена</h2><p class="intro-copy-tight">Финальный экран показывает, что уже отработано и какой следующий сценарий открыть.</p><div class="completion-grid"><div class="summary-card completion-summary"><b>Что уже умеешь</b><div class="completion-sections"><div><span class="mini-tag">Навыки</span><ul><li>попросить помощь коротко и вежливо</li><li>сказать, что не знаешь, куда идти</li><li>переспросить, если не понял</li><li>подтвердить маршрут своими словами</li></ul></div><div><span class="mini-tag">Сцены</span><ul><li>паспортный контроль без ступора</li><li>короткий разговор у стойки информации</li><li>восстановление разговора после быстрой реплики</li></ul></div></div></div><div class="summary-card readiness-card success-card"><b>Готовность</b><div class="readiness-number">${readinessScore()}/5</div><p>${readinessLabel()}</p><small>Если счёт ниже максимума, повтори самый слабый шаг.</small></div></div>${telegramValueCard()}<div class="cta-row completion-cta-row top-gap"><button class="choice ghost quiet-link" onclick="repeatWeakest()">Повторить слабое место</button><button class="choice primary-dark" onclick="setDeep()">Перейти в отдельные ситуации</button></div>`
  }
];

const deepScreens = [
  { nav: 'Выбор', html: () => deepHub() },
  { nav: 'Ситуация', html: () => deepBranch() },
  { nav: 'Пример', html: () => deepTelegram() }
];

function screens() {
  return state.mode === 'quick' ? quickScreens : deepScreens;
}

function bindInteractive() {}

function render() {
  const data = screens();
  state.index = Math.max(0, Math.min(state.index, data.length - 1));
  const current = data[state.index];
  const stepReady = canMoveForward();
  screen.className = `content-card ${current.heroClass || ''}`.trim();
  screen.innerHTML = typeof current.html === 'function' ? current.html() : current.html;
  bindInteractive();
  steps.innerHTML = data.map((s, i) => `<button class="step ${i === state.index ? 'active' : ''}" onclick="go(${i})"><span>${String(i + 1).padStart(2, '0')}</span><div><b>${s.nav}</b><small>${i < state.index ? 'Пройдено' : i === state.index ? 'Сейчас' : 'Дальше'}</small></div></button>`).join('');
  quickBtn.classList.toggle('active', state.mode === 'quick');
  deepBtn.classList.toggle('active', state.mode === 'deep');
  eyebrow.textContent = current.home ? 'Аэропорт' : (state.mode === 'quick' ? 'Аэропорт · основной маршрут' : 'Практика · следующая ситуация');
  heroTitle.textContent = current.home ? 'Испанский без паники в аэропорту' : (state.mode === 'quick' ? 'Основной маршрут по шагам' : 'Отдельные ситуации для тренировки');
  heroCopy.textContent = current.home ? 'Web готовит сцену. Telegram активирует её голосом.' : (state.mode === 'quick' ? 'Только то, что пригодится в аэропорту: слова, фразы, recovery и короткие диалоги.' : 'Выбирай нужную ситуацию и тренируй только её.');
  progressMeta.textContent = `Шаг ${state.index + 1}/${data.length}`;
  heroProgress.innerHTML = progressPills(data);
  const next = data[state.index + 1];
  controlsCopy.textContent = next ? (stepReady ? `Шаг ${state.index + 1} из ${data.length} · дальше: ${next.nav}` : lockedStepMessage()) : `Шаг ${state.index + 1} из ${data.length}`;
  const nextButton = document.getElementById('next');
  nextButton.textContent = nextLabel();
  nextButton.classList.toggle('locked', Boolean(next && !stepReady));
  document.getElementById('prev').disabled = state.index === 0;
}


document.getElementById('next').onclick = () => {
  if (!canMoveForward()) {
    flash(lockedStepMessage());
    return;
  }
  state.index = Math.min(state.index + 1, screens().length - 1);
  render();
};
document.getElementById('prev').onclick = () => { state.index = Math.max(state.index - 1, 0); render(); };
quickBtn.onclick = setQuick;
deepBtn.onclick = setDeep;

Object.assign(window, {
  go,
  setDeep,
  setQuick,
  setBranch,
  startVocabFlow,
  nextVocabCard,
  prevVocabCard,
  startVocabQuiz,
  chooseVocabQuiz,
  nextVocabQuiz,
  resetVocabFlow,
  toggleVocabTranslation,
  toggleHints,
  scrollToHowItWorks,
  addWord,
  clearPhrase,
  checkPhrase,
  choosePhraseSub,
  choosePhraseProblem,
  choosePhraseRecovery,
  chooseBasePattern,
  nextBasePattern,
  skipToPhraseVoice,
  startPhraseFlow,
  toggleVoice,
  checkVoice,
  resetVoice,
  startBorderFlow,
  chooseBorderOption,
  nextBorderTurn,
  resetBorderFlow,
  startHelpFlow,
  chooseHelpOption,
  nextHelpTurn,
  resetHelpFlow,
  flash,
  revealVocabOptions,
  revealPhraseProblem,
  revealPhraseRecovery,
  setVoiceScenario,
  repeatWeakest
});

render();

</script>
