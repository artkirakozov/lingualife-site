<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Learning — Spanish for Real Life · Airport Prototype</title>
  <style>
:root {
  --bg: radial-gradient(circle at top, #fff9ef 0%, #f5efe4 46%, #eee6da 100%);
  --ink: #161311;
  --muted: #6f675f;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {

}
button, select { font: inherit; }
.app { min-height: 100vh; display: grid; grid-template-columns: 300px 1fr; }
.sidebar {

  top: 0;

}
.brand-wrap { margin-bottom: 24px; }
.brand {

}

.step:hover { background: rgba(255,255,255,.65); color: var(--ink); }

.main { padding: 38px; max-width: 1180px; width: 100%; }

.route-card em { color: var(--muted); font-style: normal; font-weight: 700; }
.route-step {

.badge {

.grid, .home-grid, .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 22px; }

function vocabQuizOptions(index) {
  const target = vocabFlowItems[index];
  const others = vocabFlowItems.filter((item) => item[0] !== target[0]).map((item) => item[0]);
  return [target[0], ...others.slice(0, 2)].sort((a, b) => a.localeCompare(b));
}

function chooseVocabQuiz(value) {
  if (state.vocabQuizAnswered) return;
  const target = vocabFlowItems[state.vocabQuizIndex][0];
  state.vocabQuizChoice = value;
  state.vocabQuizAnswered = true;
  if (value === target) state.vocabQuizScore += 1;
  render();
}

  if (state.phraseStage !== 'build') return;
  if (state.phraseBuild.length >= state.phraseTarget.length) return;
  state.phraseBuild.push(w);
  render();
}

function clearPhrase() {

function checkPhrase() {
  if (state.phraseStage !== 'build') return;
  const built = state.phraseBuild.join(' ');
  const target = state.phraseTarget.join(' ');
  if (built === target) {
    flash('Отлично: фраза собрана правильно.');
    state.phraseStage = 'substitute';
  } else {
    flash(`Пока не так. Цель: ${target}`);

  render();
}

  if (state.phraseStage !== 'recovery') return;

}

function resetHelpFlow() {
  state.helpStage = 'intro';
  state.helpTurn = 0;
  state.helpChoice = null;
  state.helpAnswered = false;
  state.helpScore = 0;
  render();
}

function phraseFlowDone() {
  return state.phraseStage === 'ready';
}

function readinessScore() {
  let score = 0;
  if (state.vocabQuizScore >= 2) score += 1;
  if (phraseFlowDone()) score += 1;
  if (state.phraseBasicsScore >= 2) score += 1;
  if (state.borderScore >= 2) score += 1;
  if (state.helpScore >= 3) score += 1;
  return score;
}

function readinessLabel() {
  const score = readinessScore();
  if (score >= 5) return 'Ready for Telegram';
  if (score >= 3) return 'Strong enough to continue';
  return 'Prep in progress';
}

function flash(text) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function tile(label, hint, action) {
  return `<button class="word-tile ${state.showHints ? 'with-hint' : 'no-hint'}" onclick="${action}"><strong>${label}</strong>${state.showHints ? `<small>${hint}</small>` : ''}</button>`;
}

function handoffCard({ mode, branch, pending, phrases }) {
  return `<div class="handoff-card"><div><span class="section-kicker">Telegram handoff</span><h3>Переход не теряет состояние сцены</h3><p>Кнопка открывает Telegram сразу в нужной задаче. Это не “пойти в бот”, а “продолжить тот же урок в performance-режиме”.</p></div><div class="state-pill-row"><span class="state-pill">scene_id: airport_01</span><span class="state-pill">mode: ${mode}</span><span class="state-pill">branch: ${branch}</span><span class="state-pill">pending: ${pending}</span><span class="state-pill state-pill-readiness">${readinessLabel()}</span></div><div class="code-card"><b>Passed phrase set</b><code>${phrases.join(' · ')}</code></div><div class="cta-row"><button class="choice primary-dark" onclick="flash('Telegram handoff: state passed → airport_01 / ${branch}')">Practice in Telegram →</button><button class="choice ghost" onclick="flash('Web = prep, Telegram = live speaking.')">Why this matters</button></div></div>`;
}

function newWordsFlow() {

  }

  if (state.vocabStage === 'cards') {
    const item = vocabFlowItems[state.vocabCardIndex];
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">New words</span><span class="mini-score">${state.vocabCardIndex + 1}/${vocabFlowItems.length}</span></div><div class="single-word-card"><div class="single-word-photo" style="--photo:${item[3]}" role="img" aria-label="${item[1]}"></div><div class="single-word-copy"><strong>${item[0]}</strong><button class="choice ghost small-choice" onclick="toggleVocabTranslation()">${state.vocabTranslationOpen ? 'Hide translation' : 'Show translation'}</button>${state.vocabTranslationOpen ? `<div class="word-translation"><em>${item[1]}</em><p>${item[2]}</p></div>` : ''}</div></div><div class="single-word-actions"><button class="choice ghost" onclick="prevVocabCard()" ${state.vocabCardIndex === 0 ? 'disabled' : ''}>Back</button><button class="choice primary-dark" onclick="nextVocabCard()">${state.vocabCardIndex === vocabFlowItems.length - 1 ? 'Finish words' : 'Next'}</button></div></div>`;
  }

  if (state.vocabStage === 'ready') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">New words complete</span><span class="mini-score">Seen all ${vocabFlowItems.length}</span></div><h3>Хорошо. Теперь короткая проверка.</h3><p>Только после просмотра всех слов запускается мини-тест: фото → выбрать слово.</p><div class="word-flow-intro"><button class="choice primary-dark" onclick="startVocabQuiz()">Start test</button><button class="choice ghost" onclick="resetVocabFlow()">Restart words</button></div></div>`;
  }

  if (state.vocabStage === 'quiz') {

    const options = vocabQuizOptions(state.vocabQuizIndex);

  }

}

function phraseStageProgress() {
  const map = { intro: 0, build: 1, substitute: 2, problem: 3, recovery: 4, basics: 5, voice: 6, ready: 7 };
  return map[state.phraseStage] || 0;
}

function phraseFlow() {
  if (state.phraseStage === 'intro') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Phrase prep</span><span class="mini-score">7 short moves</span></div><h3>Фразы тоже идём по одной: от главной просьбы к живой реплике</h3><p>Сначала собираем главный speaking chunk, потом тренируем вариации и только затем переходим к voice check и Telegram.</p><div class="word-flow-intro"><button class="choice primary-dark" onclick="startPhraseFlow()">Start phrase flow</button></div></div>`;
  }

  if (state.phraseStage === 'build') {
    const built = state.phraseBuild.join(' ');
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Phrase flow</span><span class="mini-score">1/7</span></div><h3>Собери главную просьбу</h3><p>Нужно не знать правило, а быстро доставать полезный кусок речи.</p><div class="tile-row">${[['¿', 'начало вопроса'], ['Me', 'мне'], ['puede', 'можете'], ['ayudar', 'помочь'], ['?', 'конец вопроса']].map(([x, h]) => tile(x, h, `addWord('${x}')`)).join('')}</div><div class="target-line">${built || 'Собери: “¿Me puede ayudar?”'}</div><div class="word-flow-intro"><button class="choice primary-dark" onclick="checkPhrase()">Проверить</button><button class="choice ghost" onclick="clearPhrase()">Сбросить</button></div></div>`;
  }

  if (state.phraseStage === 'substitute') {
    const ok = state.phraseSubChoice === 'explicar';
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Phrase flow</span><span class="mini-score">2/7</span></div><h3>Меняем только действие</h3><p>Так юзер учит не одну фразу, а целую конструкцию: <b>¿Me puede ... ?</b></p><div class="quiz-stack">${[['repetir','повторить'],['explicar','объяснить'],['indicar','подсказать']].map(([option,hint]) => `<button class="choice quiz-choice ${state.phraseSubChoice === option ? (ok && option === 'explicar' ? 'correct' : option === 'explicar' ? '' : 'wrong') : ''}" onclick="choosePhraseSub('${option}')"><strong>${option}</strong><span>${hint}</span></button>`).join('')}</div>${state.phraseSubChoice ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? 'Верно: теперь learner видит, что одна конструкция держит сразу несколько глаголов.' : 'Для этой подсказки нужен вариант explicar → “¿Me puede explicar?”'}</div>${ok ? '<button class="choice primary-dark" onclick="render()">Дальше</button>' : ''}` : ''}</div>`;
  }

  if (state.phraseStage === 'problem') {
    const ok = state.phraseProblemChoice === 'No sé adónde tengo que ir.';
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Phrase flow</span><span class="mini-score">3/7</span></div><h3>Одна проблема — одна точная фраза</h3><p><b>Ситуация:</b> ты вышел после прилёта и не понимаешь, куда идти дальше.</p><div class="quiz-stack">${['No sé adónde tengo que ir.','Tengo un problema con mi equipaje.','Me alojo en un hotel.'].map((option) => `<button class="choice quiz-choice ${state.phraseProblemChoice === option ? (ok && option === 'No sé adónde tengo que ir.' ? 'correct' : option === 'No sé adónde tengo que ir.' ? '' : 'wrong') : ''}" onclick="choosePhraseProblem('${option.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>${state.phraseProblemChoice ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? 'Да: это ready-made фраза для момента, когда ты потерялся.' : 'Здесь нужна фраза про маршрут: “No sé adónde tengo que ir.”'}</div>` : ''}</div>`;
  }

  if (state.phraseStage === 'recovery') {
    const ok = state.phraseRecoveryChoice === '¿Puede repetir, por favor?';
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Phrase flow</span><span class="mini-score">4/7</span></div><h3>Recovery move, который спасает разговор</h3><p><b>Ситуация:</b> сотрудник ответил слишком быстро. Нельзя зависнуть — нужно перехватить разговор.</p><div class="quiz-stack">${['¿Puede repetir, por favor?','No, gracias.','Tengo tres días.'].map((option) => `<button class="choice quiz-choice ${state.phraseRecoveryChoice === option ? (ok && option === '¿Puede repetir, por favor?' ? 'correct' : option === '¿Puede repetir, por favor?' ? '' : 'wrong') : ''}" onclick="choosePhraseRecovery('${option.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>${state.phraseRecoveryChoice ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? 'Именно так: не угадывать, а мягко просить повторить.' : 'Здесь нужен recovery phrase: “¿Puede repetir, por favor?”'}</div>` : ''}</div>`;
  }

  if (state.phraseStage === 'basics') {
    const item = basePatternItems[state.phraseBasicsIndex];
    const ok = state.phraseBasicsChoice === item.answer;
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">${item.kicker}</span><span class="mini-score">${5 + state.phraseBasicsIndex}/7</span></div><h3>${item.title}</h3><p>${item.note}</p><div class="pattern-family">${item.forms.map(([subject, verb, tail]) => `<div class="pattern-row"><span>${subject}</span><strong>${verb}</strong><em>${tail}</em></div>`).join('')}</div><div class="target-line">${item.prompt}</div><div class="quiz-stack">${item.options.map((option) => `<button class="choice quiz-choice ${state.phraseBasicsAnswered && option === item.answer ? 'correct' : ''} ${state.phraseBasicsAnswered && state.phraseBasicsChoice === option && option !== item.answer ? 'wrong' : ''}" onclick="chooseBasePattern('${option}')">${option}</button>`).join('')}</div>${state.phraseBasicsAnswered ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? `Да — ${item.sample}` : `Не совсем. Правильно: ${item.sample}`}</div><div class="word-flow-intro"><button class="choice primary-dark" onclick="nextBasePattern()">${state.phraseBasicsIndex === basePatternItems.length - 1 ? 'Continue to voice check' : 'Next base pattern'}</button><button class="choice ghost" onclick="skipToPhraseVoice()">Skip to voice</button></div>` : ''}</div>`;
  }

  if (state.phraseStage === 'voice') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Voice check</span><span class="mini-score">7/7</span></div><h3>Теперь скажи это как один живой ход</h3><p>Сначала learner говорит просьбу и проблему вместе. Это уже почти Telegram-ready output.</p><button class="voice-button ${state.voiceRecording ? 'recording' : ''} ${state.voiceDone ? 'done' : ''}" onclick="toggleVoice()">${state.voiceRecording ? 'Остановить запись' : state.voiceDone ? 'Записано ✓' : '🎙️ Записать ответ'}</button><button class="choice" onclick="checkVoice()">AI проверить</button><button class="choice ghost" onclick="resetVoice()">Перезаписать</button><div class="target-line">Target: ¿Me puede ayudar? No sé adónde tengo que ir.</div>${state.voiceDone && !state.voiceChecked ? `<p class="microcopy">Запись уже есть. Теперь AI проверяет, слышны ли главные куски.</p>` : ''}${state.voiceChecked ? `<div class="ai-feedback"><b>AI feedback</b><ul><li>Смысл ясен: ты просишь помощь и называешь проблему.</li><li>Слышны главные chunks: <code>me puede ayudar</code>, <code>no sé</code>, <code>tengo que ir</code>.</li><li>Базовые конструкции уже подводят к сцене: quiero / voy / tengo помогут вариативно отвечать дальше.</li></ul></div>` : ''}</div>`;
  }

  return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Phrase flow complete</span><span class="mini-score">Ready</span></div><h3>Фразы собраны в рабочую мини-систему</h3><p>Теперь learner не просто видел фразы, а прошёл путь: главная просьба → вариация → проблема → recovery → базовые конструкции → голос.</p>${handoffCard({ mode: 'quick_pass', branch: 'border_then_main', pending: 'border_control', phrases: ['¿Me puede ayudar?', 'No sé adónde tengo que ir.', 'Yo quiero ayuda.', 'Yo tengo un problema.'] })}</div>`;
}

function turnByTurnFlow({ stage, introTitle, introText, startAction, resetAction, turns, currentTurn, choice, answered, resultTitle, resultText, score, nextAction, chooseAction, ctaLabel, resultCta, secondaryCta }) {
  if (stage === 'intro') {
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Live simulation</span><span class="mini-score">${turns.length} turns</span></div><h3>${introTitle}</h3><p>${introText}</p><div class="word-flow-intro"><button class="choice primary-dark" onclick="${startAction}()">Start simulation</button></div></div>`;
  }

  if (stage === 'turn') {
    const turn = turns[currentTurn];
    const ok = choice === turn.correct;
    return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Turn by turn</span><span class="mini-score">${currentTurn + 1}/${turns.length}</span></div><div class="turn-card"><div class="bot-line"><span class="section-kicker">Bot says</span><strong>${turn.bot}</strong></div><p>${turn.prompt}</p><div class="quiz-stack">${turn.options.map((option) => `<button class="choice quiz-choice ${answered && option === turn.correct ? 'correct' : ''} ${answered && choice === option && option !== turn.correct ? 'wrong' : ''}" onclick="${chooseAction}('${option.replace(/'/g, "\\'")}')">${option}</button>`).join('')}</div>${answered ? `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? turn.feedback : `Лучше так: ${turn.correct}`}</div><button class="choice primary-dark" onclick="${nextAction}()">${currentTurn === turns.length - 1 ? resultCta : ctaLabel}</button>` : ''}</div></div>`;
  }

  return `<div class="exercise word-flow-shell"><div class="exercise-topline"><span class="section-kicker">Simulation complete</span><span class="mini-score">${score}/${turns.length} solid turns</span></div><h3>${resultTitle}</h3><p>${resultText}</p><div class="summary-grid micro-summary"><div class="summary-card"><b>Что уже получилось</b><ul><li>реагировать по очереди, а не читать весь диалог заранее</li><li>выбирать короткий рабочий ответ</li><li>держать mild pressure без длинной паузы</li></ul></div><div class="summary-card"><b>Что закрепить ещё</b><ul><li>доставать ответ быстрее</li><li>не теряться при быстрой реплике</li><li>подтверждать следующий шаг своими словами</li></ul></div></div><div class="word-flow-intro"><button class="choice primary-dark" onclick="${secondaryCta}">Continue</button><button class="choice ghost" onclick="${resetAction}()">Repeat simulation</button></div></div>`;
}

  {
    nav: 'Course home',
    home: true,
    html: () => `<div class="landing-utility"><div class="selectors selectors-secondary"><label>Interface<select><option>English</option><option>Русский</option></select></label><label>Support language<select><option>Русский</option><option>English</option></select></label></div></div><span class="badge">Life Learning</span><h2 class="screen-title">Spanish for Real Life · Airport</h2><p>Learn Spanish through real airport situations.<br>Short web prep first, then live speaking in Telegram.</p>${visualStrip()}<div class="meta-row"><span class="meta-chip">Beginner</span><span class="meta-chip">7 min web prep</span><span class="meta-chip">5 min Telegram speaking</span></div><div class="cta-stack top-gap"><button class="choice primary-dark" onclick="go(1)">Start Airport Arrival</button><button class="choice ghost" onclick="scrollToHowItWorks()">How it works</button></div><section id="howItWorks" class="below-fold-stack"><div class="info-box how-it-works"><b>How it works</b><ol><li><strong>See the situation</strong><span>Start with one real airport scene.</span></li><li><strong>Collect the phrases you need</strong><span>Take only the words and patterns for that moment.</span></li><li><strong>Use them in live Telegram speaking</strong><span>Practice the scene in a short guided conversation.</span></li></ol></div><div class="home-grid below-grid"><div class="info-box"><b>Quick Pass vs Deep Dive</b><p>Quick Pass gets the learner moving fast. Deep Dive expands the same airport into stronger branches and extra speaking reps.</p></div><div class="info-box"><b>Why Telegram</b><p>Speaking practice sits inside the lesson flow, where it feels fast and natural — not like a separate product.</p></div><div class="info-box"><b>Can I skip scenes?</b><p>Yes, but the route works best in order. The first scene removes friction before the rest of the travel path.</p></div></div><div class="settings-box"><span class="section-kicker">Language settings</span><p>Language is a secondary setting, not a gate before start.</p><div class="selectors selectors-secondary low-emphasis"><label>Interface<select><option>English</option><option>Русский</option></select></label><label>Support language<select><option>Русский</option><option>English</option></select></label></div></div></section>`
  },
  {
    nav: 'Airport mission',
    heroClass: 'airport-start',
    html: () => `<span class="badge">Scene 1 · Airport arrival</span><h2 class="screen-title">Ты только что прилетел и уже должен действовать</h2><p>Ты устал, чуть потерян и тебе нужно быстро сориентироваться. Эта сцена не учит “тему аэропорт” — она доводит до первого реального win после прилёта.</p><div class="mission-grid"><div class="glass-card"><span class="section-kicker">Mission</span><ul class="checklist"><li>ответить на базовые вопросы пограничника</li><li>узнать нужные знаки в среде</li><li>попросить помощь коротко и вежливо</li><li>переспросить и подтвердить маршрут</li></ul></div><div class="glass-card"><span class="section-kicker">Product promise</span><p>В конце сцены ученик не “узнал слова”, а смог пройти border warm-up и help flow голосом.</p></div></div>`
  },
  {
    nav: 'Environment words',
    html: () => `<span class="badge">Web prep · new words</span><h2 class="screen-title">Новые слова — по одному, без словарной стены</h2><p>В этом блоке юзер видит только одно слово с одной картинкой. Сначала просмотр, потом короткий тест — и только затем переход дальше.</p>${newWordsFlow()}`
  },
  {
    nav: 'Phrase drills',
    html: () => `<span class="badge">Web prep · phrase patterns</span><h2 class="screen-title screen-title-tight">Фразы — тоже по одному, плюс база конструкций под сцену</h2><p class="intro-copy-tight">Мы убрали длинный лонгрид и разбили фразы на последовательный flow: главная просьба → проблема → recovery → базовые глаголы → voice check.</p><div class="phrase-hero-stack"><div class="info-box dark"><b>Remember these 3 first</b><p>¿Me puede ayudar?<br>No sé adónde tengo que ir.<br>¿Puede repetir, por favor?</p></div><div class="tile-row phrase-chip-row"><span class="state-pill">quiero / quiere / quieren</span><span class="state-pill">voy / va / van</span><span class="state-pill">tengo / tiene / tienen</span></div></div>${phraseFlow()}`
  },
  {
    nav: 'Border control',
    html: () => `<span class="badge">Telegram quick pass · warm-up</span><h2 class="screen-title">Пограничник: не читаем скрипт, а проходим ходы</h2><p>Эта мини-сцена теперь даёт живое ощущение задачи: вопрос → ответ → микро-фидбек → следующий ход.</p>${borderFlow()}`
  },
  {
    nav: 'Airport help',
    html: () => `<span class="badge">Telegram quick pass · main scene</span><h2 class="screen-title">Главная airport help сцена — staged simulation</h2><p>Теперь learner не видит весь идеальный диалог заранее. Он проходит сцену кусками и тренирует правильный ход в нужный момент.</p>${helpFlow()}`
  },
  {
    nav: 'Completion',
    html: () => `<span class="badge">Scene complete</span><h2 class="screen-title screen-title-tight">Airport complete: первый реальный win</h2><p class="intro-copy-tight">Теперь финальный экран больше про ощущение прогресса и следующий шаг, а не про сухой отчёт.</p><div class="completion-grid"><div class="summary-card completion-summary"><b>Что уже забираешь с собой</b><div class="completion-sections"><div><span class="mini-tag">Can do now</span><ul><li>попросить помощь коротко и вежливо</li><li>сказать, что не знаешь, куда идти</li><li>перехватить разговор через recovery phrase</li><li>подтвердить маршрут и закрыть диалог</li></ul></div><div><span class="mini-tag">Base patterns</span><ul><li><b>quiero</b> — помощь или действие</li><li><b>voy / va / van</b> — движение и маршрут</li><li><b>tengo / tiene / tienen</b> — проблема, бронь или багаж</li></ul></div></div></div><div class="summary-card readiness-card success-card"><b>Mission markers</b><div class="readiness-number">${readinessScore()}/5</div><p>${readinessLabel()}</p><small>Даже если не все маркеры собраны, learner уже прошёл end-to-end сцену и может повторить только слабое место.</small></div></div><div class="cta-row completion-cta-row top-gap"><button class="choice primary-dark" onclick="setDeep()">Open Deep Dive hub</button><button class="choice ghost quiet-link" onclick="flash('Next life scene could be city transfer / taxi.')">Continue to next life scene</button></div>`
  }
];

const deepScreens = [
  { nav: 'Deep Dive hub', html: () => deepHub() },
  { nav: 'Branch prep', html: () => deepBranch() },
  { nav: 'Telegram branch', html: () => deepTelegram() }
];

function screens() {
  return state.mode === 'quick' ? quickScreens : deepScreens;
}

function bindInteractive() {}

function render() {
  const data = screens();
  state.index = Math.max(0, Math.min(state.index, data.length - 1));
  const current = data[state.index];
  screen.className = `content-card ${current.heroClass || ''}`.trim();
  screen.innerHTML = typeof current.html === 'function' ? current.html() : current.html;
  bindInteractive();
  steps.innerHTML = data.map((s, i) => `<button class="step ${i === state.index ? 'active' : ''}" onclick="go(${i})"><span>${String(i + 1).padStart(2, '0')}</span>${s.nav}</button>`).join('');
  quickBtn.classList.toggle('active', state.mode === 'quick');
  deepBtn.classList.toggle('active', state.mode === 'deep');
  eyebrow.textContent = current.home ? 'Course entry · start the first scene' : (state.mode === 'quick' ? 'Scene 1 · Airport arrival' : 'Deep Dive · Airport branches');
  heroTitle.textContent = current.home ? 'Start with one real airport situation' : (state.mode === 'quick' ? 'Подготовься на Web. Справься в Telegram.' : 'Освой аэропорт глубже, по реальным веткам.');
  heroCopy.textContent = current.home ? 'Spanish for Real Life · Airport prototype.' : (state.mode === 'quick' ? 'Web explicitly handles prep and confidence; Telegram handles live speaking performance.' : 'Choose a stronger branch and pass the exact scene state into Telegram.');
  progressMeta.textContent = `${state.mode === 'quick' ? 'Quick Pass' : 'Deep Dive'} · Step ${state.index + 1}/${data.length}`;
}

document.getElementById('next').onclick = () => { state.index = Math.min(state.index + 1, screens().length - 1); render(); };
document.getElementById('prev').onclick = () => { state.index = Math.max(state.index - 1, 0); render(); };
quickBtn.onclick = setQuick;
deepBtn.onclick = setDeep;

Object.assign(window, {
  go,
  setDeep,
  setQuick,
  setBranch,
  startVocabFlow,
  nextVocabCard,
  prevVocabCard,
  startVocabQuiz,
  chooseVocabQuiz,
  nextVocabQuiz,
  resetVocabFlow,
  toggleVocabTranslation,
  toggleHints,
  scrollToHowItWorks,
  addWord,
  clearPhrase,
  checkPhrase,
  choosePhraseSub,
  choosePhraseProblem,
  choosePhraseRecovery,
  chooseBasePattern,
  nextBasePattern,
  skipToPhraseVoice,
  startPhraseFlow,
  toggleVoice,
  checkVoice,
  resetVoice,
  startBorderFlow,
  chooseBorderOption,
  nextBorderTurn,
  resetBorderFlow,
  startHelpFlow,
  chooseHelpOption,
  nextHelpTurn,
  resetHelpFlow,
  flash
});

render();

</script>
</body>
</html>
